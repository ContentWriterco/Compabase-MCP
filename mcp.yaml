  /tools/export_companies:
    post:
      tags: [Account]
      summary: export_companies
      operationId: export_companies
      description: |
        Bulk file export of companies matching filters (CSV / XLSX / JSON). Up to 500 rows per call.
        Default `fields=contacts_only` is name, NIP, KRS, city, email, phone, website — small enough
        for MCP clients. `fields=summary` adds location, PKD, latest revenue/profit.
        `fields=full` is the complete dump (change history, rankings, people, enrichments) and often
        exceeds client limits.

        **Consumes `export_companies` quota only after the file is built.** A failed export does
        not consume rows. The `mcp_queries` meter is left alone.

        **Example prompts:** "Export contacts for IT companies in powiat wołomiński as JSON."
        · "Bulk export active companies in PKD 62.01.Z for CRM import (contacts_only)."

        **Parameters:** `name`, `krs`, `nip`, `city`, `county` (powiat, same as `search_companies`),
        `region`, `pkd`, `revenue_min`, `revenue_max`,
        `is_active`, `format` (`csv` default, or `xlsx` / `json`), `locale` (`en`/`pl`/`de`),
        `limit` (default 50, max 500), `fields` (`contacts_only` default, or `summary` / `full`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportCompaniesArgs'
            example:
              pkd: "62.01.Z"
              county: "wołomiński"
              fields: contacts_only
              format: json
              limit: 100
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "export_companies",
                "arguments": {
                  "pkd": "62.01.Z",
                  "county": "wołomiński",
                  "fields": "contacts_only",
                  "format": "json",
                  "limit": 100
                }
              }
            }
      responses:
        '200':
          description: Exported file payload (CSV text, JSON companies, or XLSX base64)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                filename: companies_2026-09-04.json
                format: json
                fields: contacts_only
                row_count: 100
                exported: 100
                companies:
                  - name: Example Sp. z o.o.
                    nip: "5250000000"
                    krs: "0000123456"
                    city: Wołomin
                    email: biuro@example.pl
                    phone: "227600000"
                    website: example.pl

  /tools/upgrade_plan:
    post:
      tags: [Account]
      summary: upgrade_plan
      operationId: upgrade_plan
      description: |
        Create a Stripe Checkout session for a plan upgrade. Omit `plan_id` to list options.
        With `plan_id` (`pro` or `scale`) returns `checkout_url` on `checkout.stripe.com`;
        open it in the browser. Card payment happens there. Upgrade is instant after payment.

        **Does not consume quota.** Requires an MCP key (after `request_signup` / `check_signup`).

        **Example prompts:** "What plans can I upgrade to?" · "Give me a checkout link for Pro."

        **Parameters:** `plan_id` (string, optional, `pro` or `scale`), `locale` (`en`/`pl`/`de`), `currency` (`PLN`/`USD`/`EUR`).
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "upgrade_plan",
                "arguments": { "plan_id": "pro" }
              }
            }
      responses:
        '200':
          description: Upgrade options or checkout URL
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                current_plan: free
                target_plan: pro
                currency: PLN
                checkout_url: "https://checkout.stripe.com/c/pay/cs_test_..."
                session_id: "cs_test_..."
                message: "Open checkout_url in the browser to pay for pro. This is a Stripe Checkout page; card payment happens there. Upgrade is instant after payment."
                upgrade_options:
                  - id: pro
                    display_name: Pro
                    price_pln_monthly: 99
                    mcp_queries_monthly: 50
                    api_limit_monthly: 5000

  /tools/set_webhook_url:
    post:
      tags: [Account]
      summary: set_webhook_url
      operationId: set_webhook_url
      description: |
        Configure, view, or remove a webhook endpoint for watchlist event notifications.
        When configured, Compabase POSTs JSON to your URL when watched companies change.

        **Does not consume quota.**

        Available events:
        - `watchlist.company_changed` – registry data or structure changed
        - `watchlist.financials_updated` – new financial statement filed
        - `watchlist.company_removed_from_registry` – company dissolved/removed

        **Webhook signing:** Every delivery includes header `X-Compabase-Signature: t=<unix>,v1=<hex>`.
        Verify by computing `HMAC-SHA256(raw_body, webhook_secret)` and comparing with `v1`.
        The `webhook_secret` is returned on `get` and `set` actions.

        **Example prompts:** "Set my webhook to https://my-app.com/hooks/compabase."
        · "What webhook do I have configured?" · "Remove my webhook."

        **Parameters:** `action` (required: `get`/`set`/`delete`), `url` (HTTPS, for set), `events` (array, optional).
      x-codeSamples:
        - lang: json
          label: "JSON-RPC: set webhook"
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "set_webhook_url",
                "arguments": {
                  "action": "set",
                  "url": "https://my-app.com/hooks/compabase",
                  "events": ["watchlist.company_changed", "watchlist.financials_updated"]
                }
              }
            }
      responses:
        '200':
          description: Webhook configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                configured: true
                webhook_url: "https://my-app.com/hooks/compabase"
                webhook_events:
                  - watchlist.company_changed
                  - watchlist.financials_updated
                webhook_active: true
                webhook_secret: "a1b2c3d4e5f6...64_hex_chars"
                signature_header: X-Compabase-Signature
                signature_format: "t=<unix_timestamp>,v1=<hmac_sha256_hex>"

