              "params": {
                "name": "delete_byok_key",
                "arguments": { "provider": "openai" }
              }
            }
      responses:
        '200':
          description: Key removed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                provider: openai
                configured: false
                message: "openai key removed."

