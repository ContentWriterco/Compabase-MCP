            schema: {"type":"object","properties":{"lat":{"type":"number","minimum":48,"maximum":56},"lon":{"type":"number","minimum":13,"maximum":25},"radius_m":{"type":"integer","minimum":50,"maximum":5000,"description":"Default 800 m"},"modes":{"type":"array","items":{"type":"string","enum":["train","bus","tram","metro","ferry","all"]},"description":"Restrict to these modes, e.g. [\"train\"] or [\"train\",\"bus\"]. Default: all loaded."}},"required":["lat","lon"],"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}
      responses:
        '200':
          description: Tool result (JSON)

  /free/public-transport/tools/data_sources:
    post:
      tags: [free-mcp-public-transport]
      summary: "Data sources, coverage and licences"
      operationId: rozklad_data_sources
      description: "`data_sources` – Which carriers/feeds are loaded, their validity dates, licences and required attribution; which feeds can be enabled. Call it with `POST https://rozklad.compabase.com/mcp`, `method: tools/call`, `params.name: data_sources`. No key needed."
      servers:
        - url: https://rozklad.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$schema":"http://json-schema.org/draft-07/schema#","type":"object","properties":{}}
      responses:
        '200':
          description: Tool result (JSON)

  /free/public-transport/tools/rail_disruptions:
    post:
      tags: [free-mcp-public-transport]
      summary: "Railway disruptions (PKP PLK)"
      operationId: rozklad_rail_disruptions
      description: "`rail_disruptions` – Current and upcoming disruptions on Polish railway lines from PKP PLK: track closures, replacement buses (ZKA), cancellations, diversions. Optional `query` filters by station name or text (e.g. \"Kraków\", \"ZKA\"). plan_journey, departures and trip_details already flag affected trains. Call it with `POST https://rozklad.compabase.com/mcp`, `method: tools/call`, `params.name: rail_disruptions`. No key needed."
      servers:
        - url: https://rozklad.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"query":{"type":"string","description":"Station name or text to filter by"},"limit":{"type":"integer","minimum":1,"maximum":50,"description":"Max results (default 15)"}},"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}
      responses:
        '200':
          description: Tool result (JSON)

  /free/public-transport/tools/weather_warnings:
    post:
      tags: [free-mcp-public-transport]
      summary: "Weather & flood warnings (IMGW)"
      operationId: rozklad_weather_warnings
      description: "`weather_warnings` – Official IMGW-PIB meteorological warnings (storm, wind, frost, heat, snow, ice...) and flood warnings in Poland. With `place` (town, station or \"lat,lon\"): warnings for its county (powiat); without: national overview. plan_journey already adds warnings for the start and destination. Call it with `POST https://rozklad.compabase.com/mcp`, `method: tools/call`, `params.name: weather_warnings`. No key needed."
      servers:
        - url: https://rozklad.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"place":{"type":"string","description":"Town, station or 'lat,lon'"}},"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}
      responses:
        '200':
          description: Tool result (JSON)

  /free/real-estate-prices/tools/property_prices:
    post:
      tags: [free-mcp-real-estate-prices]
      summary: "Real-estate transaction prices (Poland)"
      operationId: ceny_nieruchomosci_property_prices
      description: "`property_prices` – Actual sale prices of flats, houses or building plots near a place in Poland, from notarial deeds (official Rejestr Cen Nieruchomości). Returns median price per m², interquartile range, typical total price and area, breakdown by rooms, yearly trend and recent transactions. place: address \"Poznań, Garbary 10\", street \"Kraków, Długa\", town \"Swarzędz\" or \"lat,lon\". Call it with `POST https://ceny.compabase.com/mcp`, `method: tools/call`, `params.name: property_prices`. No key needed."
      servers:
        - url: https://ceny.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"place":{"type":"string","description":"Address, street, town or 'lat,lon' in Poland"},"kind":{"type":"string","enum":["flat","house","plot"],"description":"flat = mieszkanie (default), house = dom, plot = działka niezabudowana"},"radius_m":{"type":"integer","minimum":100,"maximum":1500,"description":"Search radius in metres (default 500 for flats, 1500 for houses/plots)"},"months":{"type":"integer","minimum":1,"maximum":120,"description":"Look back this many months (default 24)"},"rooms":{"type":"integer","minimum":1,"maximum":5,"description":"Only flats with this many rooms (5 = 5+)"},"min_area":{"type":"number","description":"Minimum area m²"},"max_area":{"type":"number","description":"Maximum area m²"},"market":{"type":"string","enum":["any","primary","secondary"],"description":"primary = od dewelopera, secondary = rynek wtórny (when recorded)"},"examples":{"type":"integer","minimum":0,"maximum":25,"description":"How many recent transactions to list (default 8)"}},"required":["place"],"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}
      responses:
        '200':
          description: Tool result (JSON)

  /free/real-estate-prices/tools/parcel_report:
    post:
      tags: [free-mcp-real-estate-prices]
      summary: "Parcel check (Poland): zoning, utilities, flood, protection, prices"
      operationId: ceny_nieruchomosci_parcel_report
      description: "`parcel_report` – Everything public about one land parcel (działka) in Poland: parcel id, area and land-use class from the land register (EGiB), local zoning plan (MPZP) and zoning symbol, utility networks on or near the plot (water, sewer, gas, power, heat, telecom – GESUT), flood hazard (ISOK maps), nature protection areas (GDOŚ) and plot prices nearby (RCN). query: parcel id \"302109_4.0001.100\", \"obręb number\" like \"Bnin 100\" or \"obręb Bnin działka 100 gmina Kórnik\", an address \"Kórnik, Poznańska 1\" (the parcel under the address point) or \"lat,lon\". Call it with `POST https://ceny.compabase.com/mcp`, `method: tools/call`, `params.name: parcel_report`. No key needed."
      servers:
        - url: https://ceny.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"query":{"type":"string","description":"Parcel id, 'obręb number', address or 'lat,lon'"},"commune":{"type":"string","description":"Gmina / powiat name to pick the right parcel when 'obręb number' matches several"},"prices":{"type":"boolean","description":"Include plot prices nearby (default true)"}},"required":["query"],"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}
      responses:
        '200':
          description: Tool result (JSON)

  /free/real-estate-prices/tools/find_address:
    post:
      tags: [free-mcp-real-estate-prices]
      summary: "Find an address (Poland)"
      operationId: ceny_nieruchomosci_find_address
      description: "`find_address` – Resolve a Polish address, street or town to coordinates using the official address register (GUGiK). Useful to check which place property_prices will use. Call it with `POST https://ceny.compabase.com/mcp`, `method: tools/call`, `params.name: find_address`. No key needed."
      servers:
        - url: https://ceny.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"query":{"type":"string","description":"e.g. 'Gdańsk, Długa 5'"}},"required":["query"],"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}
      responses:
        '200':
          description: Tool result (JSON)

  /free/real-estate-prices/tools/data_sources:
    post:
      tags: [free-mcp-real-estate-prices]
      summary: "Data sources"
      operationId: ceny_nieruchomosci_data_sources
      description: "`data_sources` – Where the data comes from, licence and caveats. Call it with `POST https://ceny.compabase.com/mcp`, `method: tools/call`, `params.name: data_sources`. No key needed."
      servers:
        - url: https://ceny.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$schema":"http://json-schema.org/draft-07/schema#","type":"object","properties":{}}
      responses:
        '200':
          description: Tool result (JSON)

  /free/medicines/tools/drug_price:
    post:
      tags: [free-mcp-medicines]
      summary: "Refunded drug price, co-payment and cheaper substitutes (Poland)"
      operationId: leki_drug_price
      description: "`drug_price` – Official pharmacy price, NFZ refund limit, refund level and patient co-payment of a medicine on the Polish refund list, with cheaper equivalents (same substance, strength and pack size) and the cheapest price per tablet. Also tells if the pack is free for seniors 65+, children under 18 or pregnant women. query: brand + strength (\"Tulip 20 mg\"), substance (\"atorwastatyna 20 mg\" / \"atorvastatinum\"), pack size (\"30 szt\") or EAN/GTIN. Call it with `POST https://leki.compabase.com/mcp`, `method: tools/call`, `params.name: drug_price`. No key needed."
      servers:
        - url: https://leki.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"query":{"type":"string","description":"Drug name / substance with optional strength and pack size, or EAN/GTIN"},"indication":{"type":"string","description":"Disease or indication, when refund depends on it (e.g. 'cukrzyca')"},"max":{"type":"integer","minimum":1,"maximum":10,"description":"How many substitutes to list (default 5)"}},"required":["query"],"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}
      responses:
        '200':
          description: Tool result (JSON)

  /free/medicines/tools/drug_info:
    post:
      tags: [free-mcp-medicines]
      summary: "Medicine registration data (Poland)"
      operationId: leki_drug_info
      description: "`drug_info` – Data from the Polish Medicinal Products Register: substance, strength, form, ATC, marketing authorisation holder, prescription status (OTC / Rp / Rpz / Rpw / Lz), registered packs with EAN and links to the patient leaflet and SmPC. Call it with `POST https://leki.compabase.com/mcp`, `method: tools/call`, `params.name: drug_info`. No key needed."
      servers:
