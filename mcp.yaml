      description: "Public procurement counterparties of a company from BZP, TED and CRU: the buyers it most often wins contracts from, the contractors it most often awards contracts to, and its consortium partners — each with KRS (when known), number of contracts, total value (PLN/EUR/USD) and years. Top 20 per role plus totals. Keyed by NIP/KRS; null when the company has no public procurement."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"name":{"type":"string","description":"Company name when KRS/NIP is unknown."},"krs":{"type":"string","description":"KRS registry number."},"nip":{"type":"string","description":"NIP."}}}
      responses:
        '200':
          description: Tool result (JSON)
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": true}

  /tools/get_company_filing_timeliness:
    post:
      tags: [Tools]
      summary: get_company_filing_timeliness
      operationId: get_company_filing_timeliness
      description: "Financial statement filing timeliness from KRS register entries (date each annual statement was filed) and the Financial Document Repository: for each recent financial year the period end, filing date, statutory deadline (year end + 6 months + 15 days), days late or not filed, and whether a statutory auditor's report was filed. Also overdue_year when the latest statement is past its deadline and missing, and late_last_5y. Keyed by KRS; null when the company has never filed."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"name":{"type":"string","description":"Company name when KRS/NIP is unknown."},"krs":{"type":"string","description":"KRS registry number."},"nip":{"type":"string","description":"NIP."}}}
      responses:
        '200':
          description: Tool result (JSON)
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": true}

  /tools/get_company_secured_liabilities:
    post:
      tags: [Tools]
      summary: get_company_secured_liabilities
      operationId: get_company_secured_liabilities
      description: "Secured liabilities from the latest financial-statement notes (period ending 2025+): mortgages (hipoteki), registered / financial pledges (zastawy), transfers of ownership, assignments — with creditor, amount, secured debt, asset and land-register (KW) numbers. Keyed by KRS; null when nothing is disclosed."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"name":{"type":"string","description":"Company name when KRS/NIP is unknown."},"krs":{"type":"string","description":"KRS registry number."},"nip":{"type":"string","description":"NIP."}}}
      responses:
        '200':
          description: Tool result (JSON)
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": true}

  /tools/get_company_real_estate:
    post:
      tags: [Tools]
      summary: get_company_real_estate
      operationId: get_company_real_estate
      description: "Company real estate from the latest financial statement (period ending 2025+): land incl. perpetual usufruct, buildings and premises, investment property (book values in PLN/EUR/USD) plus property locations named as mortgage collateral (address, land-register KW numbers, creditor). Keyed by KRS; null when the balance sheet shows no real estate (micro and small entities have no such breakdown)."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"name":{"type":"string","description":"Company name when KRS/NIP is unknown."},"krs":{"type":"string","description":"KRS registry number."},"nip":{"type":"string","description":"NIP."}}}
      responses:
        '200':
          description: Tool result (JSON)
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": true}

  /tools/get_company_articles:
    post:
      tags: [Tools]
      summary: get_company_articles
      operationId: get_company_articles
      description: "Get full text of the company's articles of association or statute (umowa spółki / statut) from RAR (Repozytorium Akt Rejestrowych). Use when the user asks about: share transfer consent, preemption rights, non-compete clauses, company duration, voting rights, special share classes, representation rules from the deed, or any clause in the founding document. Returns doc metadata + full extracted text. KRS companies only."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"name":{"type":"string","description":"Company name when KRS/NIP is unknown."},"krs":{"type":"string","description":"KRS registry number."},"nip":{"type":"string","description":"NIP — used to resolve KRS when needed."},"doc_id":{"type":"string","description":"Optional: specific rar_doc_id. Omit for the latest articles / statute."}}}
      responses:
        '200':
          description: Tool result (JSON)
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": true}

  /free/nfz-waiting-times/tools/find_care:
    post:
      tags: [free-mcp-nfz-waiting-times]
      summary: "Shortest NFZ waiting times near a place"
      operationId: kolejki_nfz_find_care
      description: "`find_care` – Where a specialist, diagnostic test or treatment paid by NFZ is available soonest near a place in Poland. Returns clinics and hospitals with NFZ's forecast waiting time, people in the queue, address, phone, distance, accessibility and whether children are seen. service: everyday words (okulista, kardiolog, rezonans, zaćma, rehabilitacja…) or an exact NFZ benefit name from find_benefits. place: town, address or 'lat,lon'. Call it with `POST https://kolejki.compabase.com/mcp`, `method: tools/call`, `params.name: find_care`. No key needed."
      servers:
        - url: https://kolejki.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"service":{"type":"string","description":"What is needed, e.g. 'okulista', 'ortopeda', 'rezonans magnetyczny', 'endoprotezoplastyka stawu biodrowego'"},"place":{"type":"string","description":"Town, address or 'lat,lon' in Poland"},"benefit":{"type":"string","description":"Exact NFZ benefit name (from find_benefits / 'Inne pasujące świadczenia') – overrides service matching"},"urgent":{"type":"boolean","description":"Urgent case (referral marked 'pilne'); default false = stable case"},"children":{"type":"boolean","description":"Patient is a child – searches paediatric clinics"},"hospital":{"type":"boolean","description":"Hospital ward instead of an outpatient clinic"},"radius_km":{"type":"number","minimum":1,"maximum":300,"description":"Search radius in km (default 30, widened automatically if few results)"},"sort":{"type":"string","enum":["wait","distance"],"description":"'wait' (default) = shortest waiting time first, 'distance' = nearest first"},"max":{"type":"integer","minimum":1,"maximum":30,"description":"How many places to list (default 10)"}},"required":["service","place"],"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}
      responses:
        '200':
          description: Tool result (JSON)

  /free/nfz-waiting-times/tools/find_benefits:
    post:
      tags: [free-mcp-nfz-waiting-times]
      summary: "NFZ benefit names"
      operationId: kolejki_nfz_find_benefits
      description: "`find_benefits` – Look up official NFZ benefit names (clinics, wards, tests, procedures) matching a word, e.g. 'rezonans' or 'okulist'. Use the exact name as find_care.benefit. Call it with `POST https://kolejki.compabase.com/mcp`, `method: tools/call`, `params.name: find_benefits`. No key needed."
      servers:
        - url: https://kolejki.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"query":{"type":"string","minLength":3,"description":"Word or fragment, e.g. 'kardiolog', 'tomograf', 'zaćm'"}},"required":["query"],"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}
      responses:
        '200':
          description: Tool result (JSON)

  /free/nfz-waiting-times/tools/data_sources:
    post:
      tags: [free-mcp-nfz-waiting-times]
      summary: "Data sources"
      operationId: kolejki_nfz_data_sources
      description: "`data_sources` – Where the data comes from and caveats. Call it with `POST https://kolejki.compabase.com/mcp`, `method: tools/call`, `params.name: data_sources`. No key needed."
      servers:
        - url: https://kolejki.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$schema":"http://json-schema.org/draft-07/schema#","type":"object","properties":{}}
      responses:
        '200':
          description: Tool result (JSON)

  /free/public-transport/tools/plan_journey:
    post:
      tags: [free-mcp-public-transport]
      summary: "Plan a journey (train / bus)"
      operationId: rozklad_plan_journey
      description: "`plan_journey` – Find connections between two places in Poland, including changes between trains and buses (PKS). from/to accept a station name (\"Poznań Główny\"), a town (\"Zakopane\" = all its stops) or coordinates \"52.40,16.91\". Returns several options with times, platforms, operators, changes and live delays (today). Call it with `POST https://rozklad.compabase.com/mcp`, `method: tools/call`, `params.name: plan_journey`. No key needed."
      servers:
        - url: https://rozklad.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"from":{"type":"string","description":"Origin: station, town or 'lat,lon'"},"to":{"type":"string","description":"Destination: station, town or 'lat,lon'"},"date":{"type":"string","description":"Date: \"YYYY-MM-DD\", \"today\", \"tomorrow\", a weekday (\"friday\", \"piątek\") or \"DD.MM\". Default: today."},"time":{"type":"string","description":"Local time \"HH:MM\" (Europe/Warsaw). Default: now (today) or 04:00 (other days)."},"arrive_by":{"type":"boolean","description":"If true, `time` is the latest arrival time instead of the earliest departure."},"max_transfers":{"type":"integer","minimum":0,"maximum":6,"description":"Maximum number of changes (default 3, 0 = direct only)."},"min_transfer_minutes":{"type":"number","minimum":0,"maximum":60,"description":"Minimum time for a change (default 4)."},"modes":{"type":"array","items":{"type":"string","enum":["train","bus","tram","metro","ferry","all"]},"description":"Restrict to these modes, e.g. [\"train\"] or [\"train\",\"bus\"]. Default: all loaded."},"results":{"type":"integer","minimum":1,"maximum":10,"description":"Number of options (default 5)."},"live":{"type":"boolean","description":"Include live delays (default true)."}},"required":["from","to"],"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}
      responses:
        '200':
          description: Tool result (JSON)

  /free/public-transport/tools/departures:
    post:
      tags: [free-mcp-public-transport]
      summary: "Station departures / arrivals board"
      operationId: rozklad_departures
      description: "`departures` – Departure (or arrival) board for a station or stop: time, live delay, train/bus line, platform, destination and main stops. Optionally only services going towards a given place. Call it with `POST https://rozklad.compabase.com/mcp`, `method: tools/call`, `params.name: departures`. No key needed."
      servers:
        - url: https://rozklad.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"station":{"type":"string","description":"Station or stop name, e.g. 'Kraków Główny', 'Zbąszyń'"},"date":{"type":"string","description":"Date: \"YYYY-MM-DD\", \"today\", \"tomorrow\", a weekday (\"friday\", \"piątek\") or \"DD.MM\". Default: today."},"time":{"type":"string","description":"Local time \"HH:MM\" (Europe/Warsaw). Default: now (today) or 04:00 (other days)."},"duration_minutes":{"type":"integer","minimum":10,"maximum":1440,"description":"Time window (default 120)."},"direction":{"type":"string","description":"Only services that later call at this place, e.g. 'Poznań'."},"arrivals":{"type":"boolean","description":"Show arrivals instead of departures."},"modes":{"type":"array","items":{"type":"string","enum":["train","bus","tram","metro","ferry","all"]},"description":"Restrict to these modes, e.g. [\"train\"] or [\"train\",\"bus\"]. Default: all loaded."},"limit":{"type":"integer","minimum":1,"maximum":100,"description":"Max rows (default 30)."},"live":{"type":"boolean"}},"required":["station"],"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}
      responses:
        '200':
          description: Tool result (JSON)

  /free/public-transport/tools/trip_details:
    post:
      tags: [free-mcp-public-transport]
      summary: "Train / trip details with live delay"
      operationId: rozklad_trip_details
      description: "`trip_details` – All stops of one train or bus run with times, platforms and live delays/cancellations. Identify it by `ref` (from plan_journey/departures) or by train number/name (e.g. '3510', 'IC 3510', 'Podhalanin') plus date. Call it with `POST https://rozklad.compabase.com/mcp`, `method: tools/call`, `params.name: trip_details`. No key needed."
      servers:
        - url: https://rozklad.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"ref":{"type":"string","description":"Trip ref like 'polish-trains:PLK_IC_2026_123@2026-10-20'"},"train":{"type":"string","description":"Train number or name"},"date":{"type":"string","description":"Date: \"YYYY-MM-DD\", \"today\", \"tomorrow\", a weekday (\"friday\", \"piątek\") or \"DD.MM\". Default: today."},"live":{"type":"boolean"}},"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}
      responses:
        '200':
          description: Tool result (JSON)

  /free/public-transport/tools/find_stops:
    post:
      tags: [free-mcp-public-transport]
      summary: "Find stations and stops"
      operationId: rozklad_find_stops
      description: "`find_stops` – Search stations/stops by name (fuzzy, diacritics optional). Shows modes, coordinates and source feeds. Call it with `POST https://rozklad.compabase.com/mcp`, `method: tools/call`, `params.name: find_stops`. No key needed."
      servers:
        - url: https://rozklad.compabase.com/mcp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"query":{"type":"string","description":"Name or part of it, e.g. 'warszawa centr', 'Szklarska'"},"limit":{"type":"integer","minimum":1,"maximum":50},"modes":{"type":"array","items":{"type":"string","enum":["train","bus","tram","metro","ferry","all"]},"description":"Restrict to these modes, e.g. [\"train\"] or [\"train\",\"bus\"]. Default: all loaded."}},"required":["query"],"additionalProperties":false,"$schema":"http://json-schema.org/draft-07/schema#"}
      responses:
        '200':
          description: Tool result (JSON)

  /free/public-transport/tools/nearby_stops:
    post:
      tags: [free-mcp-public-transport]
      summary: "Stops near a location"
      operationId: rozklad_nearby_stops
      description: "`nearby_stops` – Stations and stops within a radius of coordinates (e.g. after geocoding an address). Call it with `POST https://rozklad.compabase.com/mcp`, `method: tools/call`, `params.name: nearby_stops`. No key needed."
      servers:
        - url: https://rozklad.compabase.com/mcp
      security: []
      requestBody:
