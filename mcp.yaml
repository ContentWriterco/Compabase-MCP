      ```

      **Run locally (stdio):**
      ```json
      {
        "mcpServers": {
          "szkoly": {
            "command": "npx",
            "args": [
              "-y",
              "szkoly-mcp"
            ]
          }
        }
      }
      ```

      **Data sources:** Education Information System (RSPO) and exam results of the Central Examination Board (mapa.wyniki.edu.pl).

      **Example prompts:**
      - Best primary schools in Warsaw's Ursynów.
      - How did secondary schools in Gdynia do in the matura?
      - Kindergartens within 2 km of Grunwaldzka street in Poznań.
      - Compare eighth-grade results of two schools in Lublin.

      [Overview](https://compabase.com/open-data-mcp/schools) · [Source code on GitHub](https://github.com/ContentWriterco/szkoly-mcp) · [npm package](https://www.npmjs.com/package/szkoly-mcp)

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  /setup/cursor:
    get:
      tags: [Quickstart]
      summary: Cursor / Windsurf / VS Code
      operationId: connect_cursor
      description: |
        Add a remote MCP server entry to your project or user MCP config
        (Cursor: `.cursor/mcp.json`; VS Code / Copilot and Windsurf use the same JSON shape).
        You can connect **without a key**. Ask the agent to sign you up (`request_signup`);
        after you click the email it writes `mcpk_…` into this config. Restart the client
        if it does not hot-reload MCP config.
        The sample on the right is a local config file. Compabase does not serve this path over HTTP.
      security: []
      x-codeSamples:
        - lang: json
          label: mcp.json
          source: |
            {
              "mcpServers": {
                "compabase": {
                  "url": "https://compabase.com/api/mcp"
                }
              }
            }
      responses:
        '200':
          description: Example client config (local file)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpClientConfig'
              example:
                mcpServers:
                  compabase:
                    url: https://compabase.com/api/mcp

  /setup/claude:
    get:
      tags: [Quickstart]
      summary: Claude Desktop
      operationId: connect_claude
      description: |
        Edit `claude_desktop_config.json` and restart Claude Desktop.
        macOS: `~/Library/Application Support/Claude/` ·
        Windows: `%APPDATA%\Claude\`.
        The sample on the right is a local config file. Compabase does not serve this path over HTTP.
      security: []
      x-codeSamples:
        - lang: json
          label: claude_desktop_config.json
          source: |
            {
              "mcpServers": {
                "compabase": {
                  "url": "https://compabase.com/api/mcp",
                  "headers": {
                    "Authorization": "Bearer mcpk_YOUR_KEY_HERE"
                  }
                }
              }
            }
      responses:
        '200':
          description: Example client config (local file)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpClientConfig'
              example:
                mcpServers:
                  compabase:
                    url: https://compabase.com/api/mcp
                    headers:
                      Authorization: Bearer mcpk_YOUR_KEY_HERE

  /setup/agents:
    get:
      tags: [Quickstart]
      summary: Custom agents
      operationId: connect_agents
      description: |
        Any MCP client with Streamable HTTP can connect. Typical flow:
        `initialize` → `notifications/initialized` → `tools/list` → `tools/call`.
        Frameworks such as LangChain / LangGraph MCP adapters and LlamaIndex use the same URL
        and auth headers. Each successful **data** `tools/call` consumes one MCP query from your
        plan; account tools skip that meter. Live traffic always hits
        `POST https://compabase.com/api/mcp` (samples on the right).
      security: []
      x-codeSamples:
        - lang: bash
          label: curl tools/list
          source: |
            curl -s https://compabase.com/api/mcp \
              -H "Authorization: Bearer mcpk_YOUR_KEY_HERE" \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 2,
              "method": "tools/call",
              "params": {
                "name": "search_companies",
                "arguments": {
                  "pkd": "62",
                  "city": "WARSZAWA",
                  "revenue_min": 5000000,
                  "limit": 10
                }
              }
            }
      responses:
        '200':
          description: Example JSON-RPC result from POST /api/mcp
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  tools:
                    - name: search_companies

  # ---------------------------------------------------------------------------
  # Public onboarding tools (no MCP key)
  # ---------------------------------------------------------------------------

  /tools/request_signup:
    post:
      tags: [Onboarding]
      summary: request_signup
      operationId: request_signup
      security: []
      description: |
        Start account setup. Sends a magic-link email. Poll `check_signup` with `setup_id`
        until the user clicks the link. The assistant then receives an MCP key;
        there is nothing to copy from the portal.

        **No MCP key required. Does not consume quota.**
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "request_signup",
                "arguments": { "email": "you@company.com", "client": "cursor", "locale": "en" }
              }
            }
      responses:
        '200':
          description: Pending setup session
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                setup_id: "a1b2c3..."
                status: pending
                poll_after_seconds: 3
                expires_in_minutes: 1440

  /tools/check_signup:
    post:
      tags: [Onboarding]
      summary: check_signup
      operationId: check_signup
      security: []
      description: |
        Poll `request_signup`. When the user has confirmed email, returns `mcp_key` **once**
        and `cursor_mcp_json` to write to the client config. Then reload the MCP server.

        **No MCP key required. Does not consume quota.**
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "check_signup",
                "arguments": { "setup_id": "a1b2c3..." }
              }
            }
      responses:
        '200':
          description: pending, ready, expired, or already_delivered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: ready
                mcp_key: "mcpk_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
                cursor_mcp_json:
                  mcpServers:
                    compabase:
                      url: https://compabase.com/api/mcp
                      headers:
                        Authorization: Bearer mcpk_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4

  /tools/list_plans:
    post:
      tags: [Onboarding]
      summary: list_plans
      operationId: list_plans
      security: []
      description: |
        List Compabase billing plans and limits. After sign-up, call `upgrade_plan` with
        `plan_id` to get a Stripe Checkout URL.

        **No MCP key required. Does not consume quota.**
      x-codeSamples:
