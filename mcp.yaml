openapi: 3.1.0
info:
  title: Compabase MCP
  version: 1.6.2
  description: |
    ### Introduction
    Compabase MCP exposes Polish company registry data, financial statements, rankings,
    and people to AI agents through the [Model Context Protocol](https://modelcontextprotocol.io/).
    Clients such as Cursor, Claude Desktop, Windsurf, VS Code, and custom agents call structured
    tools over Streamable HTTP (JSON-RPC 2.0).

    ### Endpoint
    `https://compabase.com/api/mcp`

    Protocol: **MCP Streamable HTTP** (JSON-RPC 2.0). Server name `compabase`, protocol version
    `2024-11-05`. Supported methods: `initialize`, `tools/list`, `tools/call`, `ping`,
    `notifications/initialized`.

    ### Client guides
    Step-by-step setup for Claude, ChatGPT, Gemini, Gemini CLI, Grok, Le Chat, Perplexity, Cursor, VS Code and Claude Code:
    [compabase.com/docs/mcp/connect](https://compabase.com/docs/mcp/connect/). OAuth clients use
    `https://compabase.com/api/mcp/connect` (sign in once, no key to copy).

    ### Topic servers
    Curated, read-only tool sets on the same data and account (same key, OAuth sign-in and quota):

    - **Polish public tenders** - `https://compabase.com/api/mcp/tenders` - `search_tenders` (open and awarded BZP/TED notices) plus company tender, EU funds and state aid tools. [GitHub](https://github.com/ContentWriterco/Polish-Public-Tenders-MCP)
    - **Polish KYB / due diligence** - `https://compabase.com/api/mcp/kyb` - registry profile, people, beneficial owners, insolvency, court gazette, sanctions, KNF. [GitHub](https://github.com/ContentWriterco/Polish-KYB-MCP)
    - **Polish company financials** - `https://compabase.com/api/mcp/financials` - financial statements, rankings and sector benchmarks. [GitHub](https://github.com/ContentWriterco/Polish-Company-Financials-MCP)

    Clients that support MCP OAuth (ChatGPT, Claude) can sign in with a Compabase account instead of pasting a key.

    ### Authentication
    You can connect **without a key** to create an account from the agent:

    - Call `request_signup` with the user's email (sends a magic link).
    - After they click the email, poll `check_signup` until `status: ready`.
    - Save the returned `mcp_key` (`mcpk_…`) in the client MCP config. After the email
      is confirmed, the key is issued for you.

    After that, send the key on every request:

    - Preferred (Headers): `Authorization: Bearer mcpk_…` or `X-API-Key: mcpk_…`
    - Claude.ai Remote Connectors: append `?apiKey=mcpk_…` to the server URL (e.g. `https://compabase.com/mcp?apiKey=mcpk_…`)
    - In-chat fallback: provide `apiKey: "mcpk_…"` in tool call arguments

    Keys can also be created in
    <a href="/integrations?tab=mcp" target="_blank" rel="noopener noreferrer">Integrations → MCP</a>.
    MCP keys (`mcpk_…`) are separate from REST API keys. Keys are stored as SHA-256 hashes and
    can be revoked immediately from the portal.

    ### Quota accounting
    **Data tools** (company search, financials, enrichments, SQL): each successful `tools/call`
    consumes one unit of the `mcp_queries` meter for your plan.
    **Account tools** (usage, plan, watchlist, keys, webhooks, BYOK, notifications) skip
    `mcp_queries`. `export_companies` is listed under Account but consumes the
    `export_companies` meter, not `mcp_queries`.
    `initialize`, `tools/list`, and `ping` also skip the meter. Limits reset with your billing
    period; see the <a href="/pricing" target="_blank" rel="noopener noreferrer">pricing page</a>.
    When the limit is reached, data tool calls return a JSON-RPC error with used/limit counts.

    ### Example prompts
    - Find active IT companies in Warsaw with revenue over 5 million PLN.
    - What is the latest revenue and net profit of Allegro?
    - List board members of the company with KRS 0000028860.
    - How many active companies in mazowieckie have primary PKD starting with 62?
    - What is the median revenue in PKD section J?
    - Is Orlen listed on GPW? What is the ticker and P/E?

servers:
  - url: https://compabase.com/api/mcp
    description: MCP Streamable HTTP endpoint

tags:
  - name: Quickstart
    description: |
      Connect your AI client to the Compabase MCP endpoint. You can start **without a key** —
      ask the agent to sign you up (`request_signup`); after email confirmation it writes
      `mcpk_…` into the client config. You can also create a key in
      <a href="/integrations?tab=mcp" target="_blank" rel="noopener noreferrer">Integrations → MCP</a>.
      Restart the client if it does not hot-reload MCP config. After connecting, ask in natural
      language; the model maps prompts to tool calls.

      The Cursor / Claude / agents recipes below show how to configure the client.
      Live traffic always goes to `POST https://compabase.com/api/mcp`.
  - name: Onboarding
    description: |
      Public tools; no MCP key required. An agent can create an account
      and receive an MCP key after the user confirms email. `upgrade_plan` still
      requires a key and returns a real Stripe Checkout URL.
  - name: Tools
    description: |
      Structured tools exposed via JSON-RPC `tools/call`. Paths below are documentation labels;
      every call goes to `POST https://compabase.com/api/mcp` with
      `method: tools/call` and `params.name` set to the tool name.

      Identify a company with `name`, `krs`, or `nip` when a tool accepts them. Monetary filters
      default to PLN unless noted. City values from KRS are typically uppercase; voivodeships lowercase.

      Register enrichments (live list):

      - `get_company_public_aid` — SUDOP public aid / grants for a company
      - `get_company_eu_funds` — European Funds (Fundusze Europejskie) projects for a company
      - `get_company_procurement` — European Commission FTS awards for a company
      - `get_company_public_tenders` — BZP public procurement data
      - `get_company_energy_licenses` — URE energy concessions for a company
      - `get_company_public_contracts` — contracts from Poland's Central Register of Contracts (CRU JSFP, Ministry of Finance) where the company is the contractor of a public-sector unit (ministries, municipalities, schools, hospitals)
      - `get_company_nfz_contracts` — contracts between the company (as a healthcare provider) and Poland's National Health Fund (NFZ)
      - `get_company_nfz_queues` — NFZ (National Health Fund) waiting lists of a healthcare provider
      - `get_company_trademarks` — Polish Patent Office (UPRP) trademarks owned or applied for by the company
      - `get_company_procurement_disputes` — National Appeal Chamber (Krajowa Izba Odwoławcza, KIO) rulings in public procurement disputes involving the company
      - `get_company_waste_registry` — BDO waste and packaging register data
      - `get_company_stock_market` — Warsaw Stock Exchange listing for a company
      - `get_company_eu_tenders` — TED EU-threshold public procurement
      - `get_company_court_gazette` — Court and Commercial Gazette (MSiG) notices for one company
      - `get_company_sanctions` — Official MSWiA sanctions listing for one company
      - `get_company_debt_registry` — KRZ insolvency / restructuring proceedings
      - `get_company_financial_supervision` — KNF register (Polish Financial Supervision Authority): licences and entries of a financial company
      - `get_company_website_facts` — Facts read from the company's own website: opening hours (per weekday), branches/locations with addresses, offer (CPV divisions plus short product/service names in PL/EN/DE), certifications found on the site (ISO 9001, HACCP, FSC…), website technology (CMS, e-commerce platform, payments, analytics) and clients/partners linked from the site that match KRS companies
      - `get_company_procurement_counterparties` — Public procurement counterparties of a company from BZP, TED and CRU: the buyers it most often wins contracts from, the contractors it most often awards contracts to, and its consortium partners
      - `get_company_filing_timeliness` — Financial statement filing timeliness from KRS register entries (date each annual statement was filed) and the Financial Document Repository: for each recent financial year the period end, filing date, statutory deadline (year end + 6 months + 15 days), days late or not filed, and whether a statutory auditor's report was filed
      - `get_company_secured_liabilities` — Secured liabilities from the latest financial-statement notes (period ending 2025+): mortgages (hipoteki), registered / financial pledges (zastawy), transfers of ownership, assignments
      - `get_company_real_estate` — Company real estate from the latest financial statement (period ending 2025+): land incl. perpetual usufruct, buildings and premises, investment property (book values in PLN/EUR/USD) plus property locations named as mortgage collateral (address, land-register KW numbers, creditor)
      - `get_company_beneficiaries` — CRBR beneficial owners for a KRS company
      - `get_company_articles` — full text of the company's articles of association or statute (umowa spółki / statut) from RAR (Repozytorium Akt Rejestrowych)
  - name: Account
    description: |
      Account management: usage, plan, watchlist, API/MCP keys, webhooks, BYOK, notifications.
      These skip the `mcp_queries` meter. `export_companies` consumes the export quota instead.
      All calls go through the same `POST https://compabase.com/api/mcp` endpoint with
      `method: tools/call`.

  - name: free-mcp
    x-displayName: Free open-data MCP servers
    x-traitTag: true
    description: |
      Free MCP servers with Polish public data, run by Compabase. No account and no API key: add the server address to your AI client (Claude, ChatGPT, Claude Code, Cursor, VS Code) and ask in plain words. Every server is open source (MIT) and can also run locally with `npx`.

      | Server | MCP endpoint |
      |---|---|
      | [NFZ waiting times](#tag/free-mcp-nfz-waiting-times) | `https://kolejki.compabase.com/mcp` |
      | [Public transport](#tag/free-mcp-public-transport) | `https://rozklad.compabase.com/mcp` |
      | [Real-estate prices](#tag/free-mcp-real-estate-prices) | `https://ceny.compabase.com/mcp` |
      | [Medicine prices](#tag/free-mcp-medicines) | `https://leki.compabase.com/mcp` |
      | [Air quality](#tag/free-mcp-air-quality) | `https://powietrze.compabase.com/mcp` |
      | [Schools](#tag/free-mcp-schools) | `https://szkoly.compabase.com/mcp` |
  - name: free-mcp-nfz-waiting-times
    x-displayName: "NFZ waiting times (free MCP)"
    description: |
      Connect your AI agent to free data on where near you a specialist will see you soonest under the NFZ. The MCP server uses forecast waiting times from official NFZ data, so you can simply ask in plain words.

      **Endpoint:** `https://kolejki.compabase.com/mcp` (MCP Streamable HTTP). No account and no API key; the server is free and read-only.

      **Claude** – Settings → Connectors → Add custom connector:
      ```text
      Name: NFZ waiting times
      URL: https://kolejki.compabase.com/mcp
      ```

      **ChatGPT** – Settings → Apps & Connectors → Advanced settings → Developer mode, then Create:
      ```text
      Name: NFZ waiting times
      URL: https://kolejki.compabase.com/mcp
      Authentication: No authentication
      ```

      **Claude Code:**
      ```bash
      claude mcp add --transport http kolejki-nfz https://kolejki.compabase.com/mcp
      ```

      **Cursor / VS Code** (`.cursor/mcp.json`):
      ```json
      {
        "mcpServers": {
          "kolejki-nfz": {
            "url": "https://kolejki.compabase.com/mcp"
          }
        }
      }
      ```

      **Run locally (stdio):**
      ```json
      {
        "mcpServers": {
          "kolejki-nfz": {
            "command": "npx",
            "args": [
              "-y",
              "kolejki-nfz-mcp"
            ]
          }
        }
      }
      ```

      **Data sources:** National Health Fund (NFZ) – "Terminy leczenia" API, refreshed daily. The forecast is an NFZ estimate, not a booking – you register by phone at the facility.

      **Example prompts:**
      - Where can I see an endocrinologist on the NFZ soonest near Lublin?
      - Knee MRI on the NFZ in Gdańsk – where is the shortest queue?
      - Orthopaedist for a child in Kraków, ideally near Nowa Huta.
      - I have an urgent referral to a neurologist and live in Piła – where to go?

      [Overview](https://compabase.com/open-data-mcp/nfz-waiting-times) · [Source code on GitHub](https://github.com/ContentWriterco/kolejki-nfz-mcp) · [npm package](https://www.npmjs.com/package/kolejki-nfz-mcp)
  - name: free-mcp-public-transport
    x-displayName: "Public transport (free MCP)"
    description: |
      Connect your AI agent to free data on train, coach and city transport connections across Poland. The MCP server combines operators' timetables with PKP PLK data on delays and disruptions along the route.

      **Endpoint:** `https://rozklad.compabase.com/mcp` (MCP Streamable HTTP). No account and no API key; the server is free and read-only.

      **Claude** – Settings → Connectors → Add custom connector:
      ```text
      Name: Public transport
      URL: https://rozklad.compabase.com/mcp
      ```

      **ChatGPT** – Settings → Apps & Connectors → Advanced settings → Developer mode, then Create:
      ```text
      Name: Public transport
      URL: https://rozklad.compabase.com/mcp
      Authentication: No authentication
      ```

      **Claude Code:**
      ```bash
      claude mcp add --transport http rozklad https://rozklad.compabase.com/mcp
      ```

      **Cursor / VS Code** (`.cursor/mcp.json`):
      ```json
      {
        "mcpServers": {
          "rozklad": {
            "url": "https://rozklad.compabase.com/mcp"
          }
        }
      }
      ```

      **Run locally (stdio):**
      ```json
      {
        "mcpServers": {
          "rozklad": {
            "command": "npx",
            "args": [
              "-y",
              "rozklad-mcp"
            ]
          }
        }
      }
      ```

      **Data sources:** GTFS timetables of rail operators, coaches and cities, PKP PLK delays and disruptions, IMGW-PIB warnings. Fares are the maximum price list – buy tickets from the operator.

      **Example prompts:**
      - How do I get from Gdynia to Toruń tomorrow at 8?
      - Departures from Warszawa Centralna to Kraków within the next hour.
      - Are there disruptions on the Poznań – Szczecin line?
      - How do I get from Zakopane station to Krupówki?

      [Overview](https://compabase.com/open-data-mcp/public-transport) · [Source code on GitHub](https://github.com/ContentWriterco/rozklad-mcp) · [npm package](https://www.npmjs.com/package/rozklad-mcp)
  - name: free-mcp-real-estate-prices
    x-displayName: "Real-estate prices (free MCP)"
    description: |
      Connect your AI agent to free data on the prices at which flats, houses and plots near you were actually sold. The MCP server uses the Real Estate Price Register based on notarial deeds, not asking prices from listings.

      **Endpoint:** `https://ceny.compabase.com/mcp` (MCP Streamable HTTP). No account and no API key; the server is free and read-only.

      **Claude** – Settings → Connectors → Add custom connector:
      ```text
      Name: Real-estate prices
      URL: https://ceny.compabase.com/mcp
      ```

      **ChatGPT** – Settings → Apps & Connectors → Advanced settings → Developer mode, then Create:
      ```text
      Name: Real-estate prices
      URL: https://ceny.compabase.com/mcp
      Authentication: No authentication
      ```

      **Claude Code:**
      ```bash
      claude mcp add --transport http ceny-nieruchomosci https://ceny.compabase.com/mcp
      ```

      **Cursor / VS Code** (`.cursor/mcp.json`):
      ```json
      {
        "mcpServers": {
          "ceny-nieruchomosci": {
            "url": "https://ceny.compabase.com/mcp"
          }
        }
      }
      ```

      **Run locally (stdio):**
      ```json
      {
        "mcpServers": {
          "ceny-nieruchomosci": {
            "command": "npx",
            "args": [
              "-y",
              "ceny-nieruchomosci-mcp"
            ]
          }
        }
      }
      ```

      **Data sources:** GUGiK – property price register (notarial deeds), land register, zoning plans, utility network maps, ISOK flood maps and GDOŚ. Deed data appears with a delay of several months.

      **Example prompts:**
      - What is the price per m² of a flat in Warsaw's Mokotów?
      - How have building-plot prices changed in Kórnik?
      - What is known about parcel 302101_2.0008.123?
      - House prices within 2 km of the market square in Wieliczka.

      [Overview](https://compabase.com/open-data-mcp/real-estate-prices) · [Source code on GitHub](https://github.com/ContentWriterco/ceny-nieruchomosci-mcp) · [npm package](https://www.npmjs.com/package/ceny-nieruchomosci-mcp)
  - name: free-mcp-medicines
    x-displayName: "Medicine prices (free MCP)"
    description: |
      Connect your AI agent to free data on how much you will pay at the pharmacy for a prescription medicine and whether there is a cheaper equivalent. The MCP server uses the official list of reimbursed medicines, which guarantees the same prices in every pharmacy.

      **Endpoint:** `https://leki.compabase.com/mcp` (MCP Streamable HTTP). No account and no API key; the server is free and read-only.

      **Claude** – Settings → Connectors → Add custom connector:
      ```text
      Name: Medicine prices
      URL: https://leki.compabase.com/mcp
      ```

      **ChatGPT** – Settings → Apps & Connectors → Advanced settings → Developer mode, then Create:
      ```text
      Name: Medicine prices
      URL: https://leki.compabase.com/mcp
      Authentication: No authentication
      ```

      **Claude Code:**
      ```bash
      claude mcp add --transport http leki https://leki.compabase.com/mcp
      ```

      **Cursor / VS Code** (`.cursor/mcp.json`):
      ```json
      {
        "mcpServers": {
          "leki": {
            "url": "https://leki.compabase.com/mcp"
          }
        }
      }
      ```

      **Run locally (stdio):**
      ```json
      {
        "mcpServers": {
          "leki": {
            "command": "npx",
            "args": [
              "-y",
              "leki-mcp"
            ]
          }
        }
      }
      ```

      **Data sources:** Ministry of Health reimbursement list and the Register of Medicinal Products. Prices of reimbursed medicines are official – the same in every pharmacy. Consult a doctor or pharmacist before switching.

      **Example prompts:**
      - Is there a cheaper equivalent of Concor 5?
      - How much is Humalog insulin with reimbursement?
      - Is Xarelto reimbursed for seniors 65+?
      - What is the substance in Nurofen Forte and is it prescription-only?

      [Overview](https://compabase.com/open-data-mcp/medicines) · [Source code on GitHub](https://github.com/ContentWriterco/leki-mcp) · [npm package](https://www.npmjs.com/package/leki-mcp)
  - name: free-mcp-air-quality
    x-displayName: "Air quality (free MCP)"
    description: |
      Connect your AI agent to free data on the air quality near you before you leave home. The MCP server uses readings from the nearest stations of the Chief Inspectorate of Environmental Protection and a forecast of pollution and pollen.

      **Endpoint:** `https://powietrze.compabase.com/mcp` (MCP Streamable HTTP). No account and no API key; the server is free and read-only.

      **Claude** – Settings → Connectors → Add custom connector:
      ```text
      Name: Air quality
      URL: https://powietrze.compabase.com/mcp
      ```

      **ChatGPT** – Settings → Apps & Connectors → Advanced settings → Developer mode, then Create:
      ```text
      Name: Air quality
      URL: https://powietrze.compabase.com/mcp
      Authentication: No authentication
      ```

      **Claude Code:**
      ```bash
      claude mcp add --transport http powietrze https://powietrze.compabase.com/mcp
      ```

      **Cursor / VS Code** (`.cursor/mcp.json`):
      ```json
      {
        "mcpServers": {
          "powietrze": {
            "url": "https://powietrze.compabase.com/mcp"
          }
        }
      }
      ```

      **Run locally (stdio):**
      ```json
      {
        "mcpServers": {
          "powietrze": {
            "command": "npx",
            "args": [
              "-y",
              "powietrze-mcp"
            ]
          }
        }
      }
      ```

      **Data sources:** Chief Inspectorate of Environmental Protection (GIOŚ) – State Environmental Monitoring (live, unverified data); forecast and pollen: Copernicus CAMS via Open-Meteo (CC BY 4.0).

      **Example prompts:**
      - Can I take my child for a walk in Zakopane today?
      - What will the smog be like in Warsaw at the weekend?
      - Will there be a lot of birch pollen in Wrocław tomorrow?
      - What is the air quality on Piotrkowska street in Łódź?

      [Overview](https://compabase.com/open-data-mcp/air-quality) · [Source code on GitHub](https://github.com/ContentWriterco/powietrze-mcp) · [npm package](https://www.npmjs.com/package/powietrze-mcp)
  - name: free-mcp-schools
    x-displayName: "Schools (free MCP)"
    description: |
      Connect your AI agent to free data on the schools near you and their exam results. The MCP server combines the register of schools and educational institutions with eighth-grade exam and matura results published by the CKE.

      **Endpoint:** `https://szkoly.compabase.com/mcp` (MCP Streamable HTTP). No account and no API key; the server is free and read-only.

      **Claude** – Settings → Connectors → Add custom connector:
      ```text
      Name: Schools
      URL: https://szkoly.compabase.com/mcp
      ```

      **ChatGPT** – Settings → Apps & Connectors → Advanced settings → Developer mode, then Create:
      ```text
      Name: Schools
      URL: https://szkoly.compabase.com/mcp
      Authentication: No authentication
      ```

      **Claude Code:**
      ```bash
      claude mcp add --transport http szkoly https://szkoly.compabase.com/mcp
      ```

      **Cursor / VS Code** (`.cursor/mcp.json`):
      ```json
