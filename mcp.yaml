  /tools/get_company_sanctions:
    post:
      tags: [Tools]
      summary: get_company_sanctions
      operationId: get_company_sanctions
      description: |
        Official MSWiA sanctions listing for one company, matched by KRS, NIP, or REGON.
        `sanctions` is null when the company is not listed. Entries include restrictive
        measures and the legal grounds. The same object is included on `get_company`.

        SQL: `company_sanctions` joined to `sanctions_entries`.

        **Example prompts:** “Is this company on a sanctions list?” · “What measures apply?”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyIdentityArgs'
            example:
              krs: "0000795863"
      responses:
        '200':
          description: Wrapper with `registry_number`, `nip`, and `sanctions` (or null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  registry_number:
                    type: string
                  nip:
                    type: string
                  sanctions:
                    nullable: true
                    type: object
              example:
                registry_number: "0000795863"
                nip: "5252796604"
                sanctions:
                  entries:
                    - source: pl_mswia
                      name: EUROCHEM POLSKA Sp. z o.o.
                      listed_on: "2022-04-26"
                      removed_on: null
                      source_url: https://www.gov.pl/web/mswia/lista-osob-i-podmiotow-objetych-sankcjami
                      measures: |
                        a. zamrożenie wszystkich środków finansowych i zasobów gospodarczych,
                        b. zakaz udostępniania podmiotowi wpisanemu na listę – bezpośrednio lub pośrednio – jakichkolwiek środków finansowych lub zasobów gospodarczych,
                        c. zakaz świadomego i umyślnego udziału w działaniach, których celem lub skutkiem jest ominięcie środków wskazanych w lit. a i b,
                        d. wykluczenie z postępowania o udzielenie zamówienia publicznego lub konkursu
                      justification: |
                        A. Melniczenko jest rosyjskim przemysłowcem, właścicielem przedsiębiorstwa EuroChem, będącego jednym z głównych producentów nawozów i przedsiębiorstwa węglowego SUEK. Należy do kręgu najbardziej wpływowych rosyjskich przedsiębiorców, mających bliskie powiązania z rządem rosyjskim. Działa zatem w sektorach gospodarczych zapewniających istotne źródło dochodów rządowi Federacji Rosyjskiej, odpowiedzialnemu za aneksję Krymu i agresję przeciwko Ukrainie. Andriej Melniczenko objęty jest sankcjami na podstawie rozporządzenia Rady (UE) nr 269/2014, zał. I, poz. 721. A ponadto sankcje na wymienionego nałożyła Wielka Brytania oraz Ukraina.

                        EUROCHEM POLSKA sp. z o. o. wytransferowała do spółki EuroChem Group AG ponad 30% przychodu osiągniętego w 2020 r.

                        Nałożenie sankcji na spółkę EuroChem Polska sp. z o.o. przyczyni się do zmniejszenia przychodów wymienionej firmy oraz podmiotów osiągających korzyści z jej działalności, a tym samym pośrednio wpłynie na zmniejszenie przychodów podmiotu powiązanego z A. Melniczenką.
                      measures_i18n:
                        en: |
                          a. freezing of all funds and economic resources,
                          b. prohibition on making available to the listed entity – directly or indirectly – any funds or economic resources,
                          c. prohibition on knowingly and intentionally participating in activities whose purpose or effect is to circumvent the measures specified in lit. a and b,
                          d. exclusion from a public procurement procedure or competition
                        de: |
                          a. Einfrieren aller Gelder und wirtschaftlichen Ressourcen,
                          b. Verbot der unmittelbaren oder mittelbaren Bereitstellung jeglicher Gelder oder wirtschaftlicher Ressourcen für die gelistete Einrichtung,
                          c. Verbot der wissentlichen und vorsätzlichen Beteiligung an Handlungen, deren Zweck oder Wirkung die Umgehung der in lit. a und b genannten Maßnahmen ist,
                          d. Ausschluss von einem Verfahren zur Vergabe eines öffentlichen Auftrags oder von einem Wettbewerb
                      justification_i18n:
                        en: |
                          A. Melniczenko is a Russian industrialist and the owner of EuroChem, one of the main fertiliser producers, and the coal company SUEK. He is among the most influential Russian businesspeople with close ties to the Russian government. He is therefore active in economic sectors that provide a significant source of revenue to the government of the Russian Federation, which is responsible for the annexation of Crimea and the aggression against Ukraine. Andriej Melniczenko is subject to sanctions under Council Regulation (EU) No 269/2014, Annex I, entry 721. In addition, the United Kingdom and Ukraine have imposed sanctions on him.

                          EUROCHEM POLSKA sp. z o. o. transferred more than 30% of the revenue it earned in 2020 r. to EuroChem Group AG.

                          Imposing sanctions on EuroChem Polska sp. z o.o. will reduce the revenue of that company and of entities benefiting from its activities, and will thereby indirectly reduce the revenue of an entity linked to A. Melniczenko.
                        de: |
                          A. Melniczenko ist ein russischer Industrieller und Eigentümer von EuroChem, einem der wichtigsten Düngemittelhersteller, sowie des Kohleunternehmens SUEK. Er gehört zum Kreis der einflussreichsten russischen Unternehmer mit engen Verbindungen zur russischen Regierung. Er ist somit in Wirtschaftssektoren tätig, die der Regierung der Russischen Föderation, die für die Annexion der Krim und die Aggression gegen die Ukraine verantwortlich ist, eine wesentliche Einnahmequelle bieten. Andriej Melniczenko unterliegt Sanktionen gemäß der Verordnung (EU) Nr. 269/2014 des Rates, Anhang I, Eintrag 721. Darüber hinaus haben das Vereinigte Königreich und die Ukraine Sanktionen gegen ihn verhängt.

                          EUROCHEM POLSKA sp. z o. o. überwies mehr als 30 % der im Jahr 2020 r. erzielten Einnahmen an EuroChem Group AG.

                          Die Verhängung von Sanktionen gegen EuroChem Polska sp. z o.o. wird dazu beitragen, die Einnahmen dieses Unternehmens und der Einrichtungen, die von seiner Tätigkeit profitieren, zu verringern und damit mittelbar die Einnahmen einer mit A. Melniczenko verbundenen Einrichtung zu senken.

  /tools/get_company_nfz_queues:
    post:
      tags: [Tools]
      summary: get_company_nfz_queues
      operationId: get_company_nfz_queues
      description: |
        NFZ (National Health Fund) waiting lists of a healthcare provider from the NFZ "Terminy leczenia" API:
        every NFZ-funded service it runs a waiting list for, per location, with the NFZ forecast waiting time
        (stable and urgent case), people waiting, average wait, address, phone, children and accessibility.
        Sorted by shortest wait; optional `service` and `town` filters. Keyed by NIP. The forecast is not a booking.

        **Example prompts:** “How long is the wait for an ophthalmologist at this clinic?” · “NFZ waiting lists of NIP 7792236896 in Poznań”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CompanyIdentityArgs'
                - type: object
                  properties:
                    service:
                      type: string
                      description: Fragment of the service name, e.g. `okulist`, `rezonans`.
                    town:
                      type: string
                      description: Town or district, e.g. `Poznań`.
                    limit:
                      type: integer
                      default: 50
                      maximum: 400
            example:
              krs: "0000446005"
              service: alergolog
      responses:
        '200':
          description: Wrapper with `registry_number`, `nip`, `queues` (null when the provider has no waiting lists)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                registry_number: "0000446005"
                nip: "7792236896"
                queues:
                  queues_count: 30
                  places_count: 2
                  data_as_of: "2026-10-10"
                  matched: 2
                  items:
                    - benefit_display: Poradnia alergologiczna
                      town: Poznań-Grunwald
                      address: Kosynierska 10
                      phone: 061 86 38 524
                      wait_days: 37
                      wait_label_pl: 1 mies. 1 tydz.
                      urgent_wait_label_pl: 1 dzień
                      awaiting: 126
                      average_days: 56

  /tools/get_company_beneficiaries:
    post:
      tags: [Tools]
      summary: get_company_beneficiaries
      operationId: get_company_beneficiaries
      description: |
        CRBR beneficial owners for a KRS company (spółki). Compabase returns these names for
        every KRS company, same as zarząd and wspólnicy. PESEL is never in the payload;
        age is `birth_year` only.

        JDG (CEIDG) are a separate catalog: only firms with a public contact email appear
        (`ceidg_chat`). A RODO objection or missing email removes that JDG from the catalog.
        CRBR does not apply to JDG.

        SQL: `company_crbr_public` / `company_crbr_beneficiaries_public`. Raw
        `company_crbr_beneficiaries` is rejected.

        **Example prompts:** “Who are the beneficial owners?” · “CRBR UBOs for this KRS.”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyIdentityArgs'
            example:
              krs: "0000159161"
      responses:
        '200':
          description: CRBR details for a KRS company (birth_year only; never PESEL)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                registry_number: "0000159161"
                nip: "9542441248"
                crbr:
                  checked_at: "2026-08-05T21:28:29.091Z"
                  has_beneficiaries: true
                  beneficiaries_count: 46
                  company_name: AKADEMICKI ZWIĄZEK SPORTOWY UNIWERSYTETU ŚLĄSKIEGO
                  status: IstniejaInformacje
                  source_url: https://www.podatki.gov.pl/crbr/
                  beneficiaries:
                    - display_name: JAN KOWALSKI
                      birth_year: 1980
                      citizenship_name: POLSKA
                      rights_summary: CZŁONEK ZARZĄDU
                      shares:
                        - other_rights:
                            kind_code: "001"
                            kind_name: inna osoba fizyczna mająca wpływ na stowarzyszenie
                            description: CZŁONEK ZARZĄDU
                          direct_ownership: null
                          indirect_ownership: null

  /tools/execute_sql:
    post:
      tags: [Tools]
      summary: execute_sql
      operationId: execute_sql
      description: |
        Run a **read-only** SQL `SELECT` (or `WITH … SELECT`) against the Compabase database.
        Use this for custom joins and multi-step aggregations the other tools cannot express.
        Prefer dedicated tools (`search_companies`, `get_financials`, and similar) when they
        cover the question — they return smaller, more predictable payloads.
        CRBR names for KRS companies: `company_crbr_*_public` (all companies; birth_year only).
        Raw `company_crbr_beneficiaries` is rejected. JDG people live in `ceidg_chat` (email required).

        **Example prompts:** “Write SQL that groups companies by region and sums revenue for PKD 62.”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: A read-only SQL SELECT or WITH…SELECT statement.
            example:
              query: |
                SELECT region, COUNT(*) AS n
                FROM company_search
                WHERE primary_pkd LIKE '62%'
                GROUP BY region
                ORDER BY n DESC
                LIMIT 20
      responses:
        '200':
          description: Query rows
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                rows:
                  - region: mazowieckie
                    n: 12000

