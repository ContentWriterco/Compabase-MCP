          description: Plan catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                plans:
                  - id: free
                    display_name: Free
                    price_pln_monthly: 0
                    export_limit_monthly: 50
                    api_limit_monthly: 100
                    ask_ai_credits_monthly: 3
