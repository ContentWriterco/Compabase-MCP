          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "create_api_key",
                "arguments": { "name": "Analytics" }
              }
            }
      responses:
        '200':
          description: Created key (raw_key shown once)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: "uuid-new"
                name: Analytics
                key_prefix: "cb_f3e4"
                raw_key: "cb_f3e4a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
                note: "Save this key now; it will never be shown again."

  /tools/delete_api_key:
    post:
      tags: [Account]
      summary: delete_api_key
      operationId: delete_api_key
      description: |
        Revoke (deactivate) a REST API key by its ID. The key stops working immediately.
        Use `list_api_keys` to get the ID.

        **Does not consume quota.**

        **Example prompts:** "Delete my API key with ID uuid-1."

        **Parameters:** `key_id` (string, required); UUID of the key to revoke (from `list_api_keys`).
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "delete_api_key",
                "arguments": { "key_id": "uuid-1" }
              }
            }
      responses:
        '200':
          description: Revocation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                success: true
                revoked_key_id: "uuid-1"

  /tools/list_mcp_keys:
    post:
      tags: [Account]
      summary: list_mcp_keys
      operationId: list_mcp_keys
      description: |
        List all active MCP keys (`mcpk_…`) for the account.
        Returns id, name, key_prefix, created_at, last_used_at.

        **Does not consume quota.**

        **Example prompts:** "Show my MCP keys." · "How many MCP keys do I have?"
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": { "name": "list_mcp_keys", "arguments": {} }
            }
      responses:
        '200':
          description: MCP keys list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                keys:
                  - id: "uuid-m1"
                    name: "Cursor key"
                    key_prefix: "mcpk_c1d2"
                    is_active: true
                    created_at: "2026-07-01T08:00:00.000Z"
                    last_used_at: "2026-08-24T19:30:00.000Z"

  /tools/create_mcp_key:
    post:
      tags: [Account]
      summary: create_mcp_key
      operationId: create_mcp_key
      description: |
        Create a new MCP key (`mcpk_…`). The raw key is returned **once**; store it securely.

        **Does not consume quota.**

        **Example prompts:** "Create a new MCP key called 'Claude Desktop'."

        **Parameters:** `name` (string, required, max 100 chars); human-readable label.
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "create_mcp_key",
                "arguments": { "name": "Claude Desktop" }
              }
            }
      responses:
        '200':
          description: Created key (raw_key shown once)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: "uuid-m-new"
                name: Claude Desktop
                key_prefix: "mcpk_a1b2"
                raw_key: "mcpk_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
                note: "Save this key now; it will never be shown again."

  /tools/delete_mcp_key:
    post:
      tags: [Account]
      summary: delete_mcp_key
      operationId: delete_mcp_key
      description: |
        Revoke (deactivate) an MCP key by its ID. Cannot revoke the key currently in use
        (the one authenticating this request). Use `list_mcp_keys` to get IDs.

        **Does not consume quota.**

        **Example prompts:** "Revoke MCP key uuid-m1."

        **Parameters:** `key_id` (string, required); UUID of the MCP key to revoke (from `list_mcp_keys`).
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "delete_mcp_key",
                "arguments": { "key_id": "uuid-m1" }
              }
            }
      responses:
        '200':
          description: Revocation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                success: true
                revoked_key_id: "uuid-m1"

  /tools/export_companies:
    post:
      tags: [Account]
      summary: export_companies
      operationId: export_companies
      description: |
        Bulk file export of companies matching filters (CSV / XLSX / JSON). Up to 500 rows per call.
        Default `fields=contacts_only` is name, NIP, KRS, city, email, phone, website – small enough
        for MCP clients. `fields=summary` adds location, PKD, latest revenue/profit.
        `fields=full` is the complete dump (change history, rankings, people, enrichments) and often
        exceeds client limits.

        **Consumes `export_companies` quota only after the file is built.** A failed export does
        not consume rows. The `mcp_queries` meter is left alone.

        **Example prompts:** "Export contacts for IT companies in powiat wołomiński as JSON."
        · "Bulk export active companies in PKD 62.01.Z for CRM import (contacts_only)."

        **Parameters:** `name`, `krs`, `nip`, `city`, `county` (powiat, same as `search_companies`),
        `region`, `pkd`, `revenue_min`, `revenue_max`,
        `is_active`, `format` (`csv` default, or `xlsx` / `json`), `locale` (`en`/`pl`/`de`),
        `limit` (default 50, max 500), `fields` (`contacts_only` default, or `summary` / `full`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportCompaniesArgs'
            example:
              pkd: "62.01.Z"
              county: "wołomiński"
              fields: contacts_only
              format: json
              limit: 100
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "export_companies",
                "arguments": {
                  "pkd": "62.01.Z",
                  "county": "wołomiński",
                  "fields": "contacts_only",
                  "format": "json",
                  "limit": 100
                }
              }
            }
      responses:
        '200':
          description: Exported file payload (CSV text, JSON companies, or XLSX base64)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                filename: companies_2026-09-04.json
                format: json
                fields: contacts_only
                row_count: 100
                exported: 100
                companies:
                  - name: Example Sp. z o.o.
                    nip: "5250000000"
                    krs: "0000123456"
                    city: Wołomin
                    email: biuro@example.pl
                    phone: "227600000"
                    website: example.pl

  /tools/upgrade_plan:
    post:
      tags: [Account]
      summary: upgrade_plan
      operationId: upgrade_plan
      description: |
        Create a Stripe Checkout session for a plan upgrade. Omit `plan_id` to list options.
        With `plan_id` (`pro` or `scale`) returns `checkout_url` on `checkout.stripe.com`;
        open it in the browser. Card payment happens there. Upgrade is instant after payment.

        **Does not consume quota.** Requires an MCP key (after `request_signup` / `check_signup`).

        **Example prompts:** "What plans can I upgrade to?" · "Give me a checkout link for Pro."

        **Parameters:** `plan_id` (string, optional, `pro` or `scale`), `locale` (`en`/`pl`/`de`), `currency` (`PLN`/`USD`/`EUR`).
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "upgrade_plan",
                "arguments": { "plan_id": "pro" }
              }
            }
      responses:
        '200':
          description: Upgrade options or checkout URL
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                current_plan: free
                target_plan: pro
                currency: PLN
                checkout_url: "https://checkout.stripe.com/c/pay/cs_test_..."
                session_id: "cs_test_..."
                message: "Open checkout_url in the browser to pay for pro. This is a Stripe Checkout page; card payment happens there. Upgrade is instant after payment."
                upgrade_options:
                  - id: pro
                    display_name: Pro
                    price_pln_monthly: 99
                    mcp_queries_monthly: 50
                    api_limit_monthly: 5000

  /tools/set_webhook_url:
    post:
      tags: [Account]
      summary: set_webhook_url
      operationId: set_webhook_url
      description: |
        Configure, view, or remove a webhook endpoint for watchlist event notifications.
        When configured, Compabase POSTs JSON to your URL when watched companies change.

        **Does not consume quota.**

        Available events:
        - `watchlist.company_changed` – registry data or structure changed
        - `watchlist.financials_updated` – new financial statement filed
        - `watchlist.company_removed_from_registry` – company dissolved/removed

        **Webhook signing:** Every delivery includes header `X-Compabase-Signature: t=<unix>,v1=<hex>`.
        Verify by computing `HMAC-SHA256(raw_body, webhook_secret)` and comparing with `v1`.
        The `webhook_secret` is returned on `get` and `set` actions.

        **Example prompts:** "Set my webhook to https://my-app.com/hooks/compabase."
        · "What webhook do I have configured?" · "Remove my webhook."

        **Parameters:** `action` (required: `get`/`set`/`delete`), `url` (HTTPS, for set), `events` (array, optional).
      x-codeSamples:
        - lang: json
          label: "JSON-RPC: set webhook"
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "set_webhook_url",
                "arguments": {
                  "action": "set",
                  "url": "https://my-app.com/hooks/compabase",
                  "events": ["watchlist.company_changed", "watchlist.financials_updated"]
                }
              }
            }
      responses:
        '200':
          description: Webhook configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                configured: true
                webhook_url: "https://my-app.com/hooks/compabase"
                webhook_events:
                  - watchlist.company_changed
                  - watchlist.financials_updated
                webhook_active: true
                webhook_secret: "a1b2c3d4e5f6...64_hex_chars"
                signature_header: X-Compabase-Signature
                signature_format: "t=<unix_timestamp>,v1=<hmac_sha256_hex>"

  /tools/get_byok_keys:
    post:
      tags: [Account]
      summary: get_byok_keys
      operationId: get_byok_keys
      description: |
        List status of Bring-Your-Own-Key (BYOK) provider keys: OpenAI, Claude, Gemini.
        Shows whether each is configured, key prefix, and last used date.
        The actual key value is omitted.

        **Does not consume quota.**

        **Example prompts:** "Which AI provider keys do I have configured?"
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": { "name": "get_byok_keys", "arguments": {} }
            }
      responses:
        '200':
          description: BYOK status per provider
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                openai:
                  configured: true
                  key_prefix: "sk-proj-abcdef…"
                  updated_at: "2026-07-15T10:00:00.000Z"
                  last_used_at: "2026-08-24T18:30:00.000Z"
                claude:
                  configured: false
                  key_prefix: null
                  updated_at: null
                  last_used_at: null
                gemini:
                  configured: false
                  key_prefix: null
                  updated_at: null
                  last_used_at: null

  /tools/set_byok_key:
    post:
      tags: [Account]
      summary: set_byok_key
      operationId: set_byok_key
      description: |
        Add or update a BYOK provider API key. Encrypted at rest (AES-256-GCM).
        Requires a paid plan (Pro or higher).

        **Does not consume quota.**

        Providers & key formats:
        - `openai`: `sk-…` (OpenAI API key)
        - `claude`: `sk-ant-…` (Anthropic Claude key)
        - `gemini`: `AIza…` or `AQ.…` (Google AI Studio key)

        **Example prompts:** "Set my OpenAI key to sk-proj-abc123..."

        **Parameters:** `provider` (required), `api_key` (required).
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "set_byok_key",
                "arguments": {
                  "provider": "openai",
                  "api_key": "sk-proj-your-key-here"
                }
              }
            }
      responses:
        '200':
          description: Key saved confirmation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                provider: openai
                configured: true
                key_prefix: "sk-proj-your-k…"
                updated_at: "2026-08-25T10:00:00.000Z"

  /tools/delete_byok_key:
    post:
      tags: [Account]
      summary: delete_byok_key
      operationId: delete_byok_key
      description: |
        Remove a BYOK provider key. After removal, the platform uses its own model access.

        **Does not consume quota.**

        **Example prompts:** "Remove my OpenAI key." · "Delete Gemini API key."

        **Parameters:** `provider` (required: `openai`, `claude`, or `gemini`).
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "delete_byok_key",
                "arguments": { "provider": "openai" }
              }
            }
      responses:
        '200':
          description: Key removed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                provider: openai
                configured: false
                message: "openai key removed."

  /tools/batch_add_to_watchlist:
    post:
      tags: [Account]
      summary: batch_add_to_watchlist
      operationId: batch_add_to_watchlist
      description: |
        Add multiple companies to the watchlist in a single call. Provide an array of KRS/NIP
        identifiers (max 500 per call). Resolves identifiers, skips already-followed, respects
        plan watchlist limits.

        **Does not consume `mcp_queries` quota.**

        **Example prompts:** "Add these companies to my watchlist: 0000028860, 5213002255, 0000635012."
        · "Bulk import KRS numbers to watchlist."

        **Parameters:** `identifiers` (array of strings, required); KRS/NIP numbers.
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "batch_add_to_watchlist",
                "arguments": {
                  "identifiers": ["0000028860", "5213002255", "0000635012"]
                }
              }
            }
      responses:
        '200':
          description: Batch import result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                added: 2
                already_following: 1
                not_found: 0
                total_resolved: 3

  /tools/set_notification_preferences:
    post:
      tags: [Account]
      summary: set_notification_preferences
      operationId: set_notification_preferences
      description: |
        Get or update email notification preferences for watchlist changes.
        When `email_notifications` is true, Compabase emails you when a watched
        company's data changes (registry updates, new financials, deregistration).

        **Does not consume `mcp_queries` quota.**

        **Example prompts:** “Turn on watchlist email alerts.” · “What are my notification settings?”

        **Parameters:** `action` (required: `get` / `set`), `email_notifications` (boolean, required for set),
        `notification_email` (optional override; omit to use the account email).
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "set_notification_preferences",
                "arguments": {
                  "action": "set",
                  "email_notifications": true
                }
              }
            }
      responses:
        '200':
          description: Current or updated notification preferences
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                email_notifications: true
                notification_email: null
                webhook_url: null
                webhook_active: false
                updated: true

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: mcpk
      description: "MCP key from Integrations → MCP (`Authorization: Bearer mcpk_…`)."
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Alternative header with the raw `mcpk_…` key.
  schemas:
    McpClientConfig:
      type: object
      required: [mcpServers]
      properties:
        mcpServers:
          type: object
          additionalProperties:
            type: object
            properties:
              url:
                type: string
                format: uri
              headers:
                type: object
                additionalProperties:
                  type: string
    CompanyIdentityArgs:
      type: object
      description: Identify a company with at least one of name, krs, or nip.
      properties:
        name:
          type: string
          description: Company name when KRS/NIP is unknown (legal-form suffix optional).
        krs:
          type: string
          description: KRS registry number (10 digits, zero-padded).
          example: "0000028860"
        nip:
          type: string
          description: NIP tax number (10 digits, dashes optional).
          example: "5250000000"
    SearchCompaniesArgs:
      type: object
      properties:
        name:
          type: string
          description: Company name fragment (case-insensitive). Legal-form suffixes ignored.
        krs:
          type: string
          description: KRS (10 digits, zero-padded).
        nip:
          type: string
          description: NIP (10 digits, no dashes).
        city:
          type: string
          description: City; KRS uses uppercase (e.g. WARSZAWA).
        county:
          type: string
          description: County / powiat (lowercase).
        region:
          type: string
          description: Voivodeship (lowercase), e.g. mazowieckie.
        postal_code:
          type: string
          description: Postal code prefix, e.g. 00-9.
        pkd:
          type: string
          description: Primary PKD prefix, e.g. 62 or 46.90.Z.
        all_pkd:
          type: string
          description: Match any PKD in the activity list (not only primary).
        legal_form:
          type: string
          description: Legal form fragment, e.g. spółka z o.o.
        currency:
          type: string
          enum: [pln, usd, eur]
          description: Currency for monetary filters. Default pln.
        revenue_min:
          type: number
        revenue_max:
          type: number
        profit_min:
          type: number
        profit_max:
          type: number
        profit_operating_min:
          type: number
        profit_operating_max:
          type: number
        total_assets_min:
          type: number
        total_assets_max:
          type: number
        ebitda_min:
          type: number
        ebitda_max:
          type: number
        capital_min:
          type: number
        capital_max:
          type: number
        estimated_value_min:
          type: number
        estimated_value_max:
          type: number
        is_active:
          type: boolean
          description: true = active only, false = closed only. Omit for all.
        has_email:
          type: boolean
          description: true = only companies with email on record. Matching rows include contacts.email.
        has_website:
          type: boolean
          description: true = only companies with website on record. Matching rows include contacts.website.
        sort_by:
          type: string
          enum: [revenue_total, profit_net, total_assets, profit_operating, ebitda, capital_total, estimated_value]
          description: Sort field (default revenue_total).
        sort_dir:
          type: string
          enum: [asc, desc]
          description: Sort direction (default desc).
        year:
          type: integer
          description: Latest financial period calendar year. For sector browse only; omit for identity lookup.
        limit:
          type: integer
          minimum: 1
          maximum: 50
          description: Max results (default 10, max 50).
        fields:
          type: string
          enum: [contacts_only, summary, full]
          description: >
            Response size. Default summary (name, NIP, KRS, location, PKD, latest financials,
            email/phone/website). contacts_only is a CRM list. full returns every company_search
            column and may exceed MCP client limits.
    CountCompaniesArgs:
      type: object
      properties:
        name:
          type: string
        krs:
          type: string
        nip:
          type: string
        city:
          type: string
        county:
          type: string
          description: County / powiat (lowercase).
        region:
          type: string
        pkd:
          type: string
        all_pkd:
          type: string
        legal_form:
          type: string
        revenue_min:
          type: number
        revenue_max:
          type: number
        profit_min:
          type: number
        profit_max:
          type: number
        profit_operating_min:
          type: number
        profit_operating_max:
          type: number
        total_assets_min:
          type: number
        total_assets_max:
          type: number
        ebitda_min:
          type: number
        ebitda_max:
          type: number
        capital_min:
          type: number
        capital_max:
          type: number
        estimated_value_min:
          type: number
        estimated_value_max:
          type: number
        is_active:
          type: boolean
        has_email:
          type: boolean
        has_website:
          type: boolean
        year:
          type: integer
    ExportCompaniesArgs:
      type: object
      properties:
        name:
          type: string
        krs:
          type: string
        nip:
          type: string
        city:
          type: string
        county:
          type: string
          description: County / powiat. Same filter as search_companies.
        region:
          type: string
        pkd:
          type: string
        revenue_min:
          type: number
        revenue_max:
          type: number
        is_active:
          type: boolean
        format:
          type: string
          enum: [csv, xlsx, json]
          description: Export format (default csv).
        locale:
          type: string
          enum: [en, pl, de]
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: Max rows (default 50, max 500).
        fields:
          type: string
          enum: [contacts_only, summary, full]
          description: >
            Payload size. Default contacts_only (name, NIP, KRS, city, email, phone, website).
            summary adds location, PKD, latest revenue/profit. full is the complete dump and
            often exceeds MCP client limits.
