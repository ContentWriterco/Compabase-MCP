            }
      responses:
        '200':
          description: BYOK status per provider
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                openai:
                  configured: true
                  key_prefix: "sk-proj-abcdef…"
                  updated_at: "2026-07-15T10:00:00.000Z"
