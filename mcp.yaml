                message: "Free includes MCP with a small monthly query limit after sign-up. After the user confirms email, call upgrade_plan with plan_id 'pro' or 'scale' to get a Stripe checkout URL."

  /tools/search_companies:
    post:
      tags: [Tools]
      summary: search_companies
      operationId: search_companies
      description: |
        Search and filter Polish KRS companies (spółki). Compabase also holds the full CEIDG/JDG register;
        this tool does not browse JDG — those without a public contact email are hidden because of RODO.
        Default `fields=summary` returns compact rows
        (name, NIP, KRS, location, PKD, latest financials, email/phone/website).
        `fields=contacts_only` is a CRM list. `fields=full` returns every company_search column
        and may exceed MCP client size limits.

        Use for rankings, sector filters, city/county/region browsing, name search, or NIP/KRS lookup.
        For lookup by name/KRS/NIP, omit `year`. Use `year` only for sector/ranking browse.
        Sparse results in JDG-dominated PKDs include a `hint` (full CEIDG is in the database; listing is RODO-gated).
        Do not call `export_companies` just to get a handful of emails or phones.

        **Example prompts:** “Find IT companies (PKD 62) in Warsaw with revenue over 5 million PLN.”
        · “Top 20 companies by EBITDA in wielkopolskie that are still active.”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCompaniesArgs'
            example:
              pkd: "62"
              city: "WARSZAWA"
              revenue_min: 5000000
              is_active: true
              sort_by: revenue_total
              fields: summary
              limit: 20
      responses:
        '200':
          description: Tool result (JSON text content from MCP)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                fields: summary
                returned_count: 1
                companies:
                  - name: Example Sp. z o.o.
                    nip: "5250000000"
                    krs: "0000123456"
                    city: Warszawa
                    county: M.st. Warszawa
                    region: mazowieckie
                    primary_pkd: 62.01.Z
                    revenue_total: 12500000
                    profit_net: 890000
                    email: biuro@example.pl
                    phone: "221234567"
                    website: example.pl

  /tools/count_companies:
    post:
      tags: [Tools]
      summary: count_companies
      operationId: count_companies
      description: |
        Count KRS companies matching the same filter family as `search_companies` (without sort/limit).
        Does not count JDG in this tool (full CEIDG is in Compabase; listing is RODO-gated). Returns a single number; there is no company list.
        Sparse or zero counts in JDG-dominated PKDs include a `hint`.

        **Example prompts:** “How many active companies in mazowieckie have primary PKD starting with 62?”
        · “Count companies with revenue between 1 and 10 million PLN in Kraków.”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountCompaniesArgs'
            example:
              region: mazowieckie
              pkd: "62"
              is_active: true
      responses:
        '200':
          description: Count result
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
              example:
                count: 1842

  /tools/get_company:
    post:
      tags: [Tools]
      summary: get_company
      operationId: get_company
      description: |
        Registry profile and headline financials for **one** latest filed period
        (`financials.period_to`). Revenue, profit, costs, and assets in this response are that
        same period — there is no nested summary from a different year. Contacts (email, phone,
        website) are included when on record. NIP lookup also returns a CEIDG/JDG firm when it
        has a public contact email (RODO). Full balance-sheet line items and earlier years
        are in `get_financials`.

        **Example prompts:** “Give me a company profile for Allegro.” · “Look up KRS 0000028860.”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyIdentityArgs'
            example:
              name: Allegro
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                name: Allegro sp. z o.o.
                krs: "0000000000"
                nip: "5250000000"
                financial_period_to: "2025-12-31"
                revenue_total: 1000000000
                profit_net: 50000000
                financials:
                  period_to: "2025-12-31"
                  revenue_total: 1000000000
                  profit_net: 50000000
                has_email: true
                contacts:
                  email: kontakt@allegro.pl
                  phone: "226000000"
                  website: allegro.pl

  /tools/get_financials:
    post:
      tags: [Tools]
      summary: get_financials
      operationId: get_financials
      description: |
        Full financial statement metrics per fiscal period: cash, inventories, receivables,
        liabilities, equity, cost breakdown, revenue lines, and other statement columns.

        **Example prompts:** “Show cash, liabilities, and equity from 2019 to 2023.”
        · “What was net profit and total assets year by year?”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CompanyIdentityArgs'
                - type: object
                  properties:
                    year_from:
                      type: integer
                      description: Earliest fiscal year (e.g. 2019).
                      example: 2019
                    year_to:
                      type: integer
                      description: Latest fiscal year (e.g. 2023).
                      example: 2023
            example:
              krs: "0000028860"
              year_from: 2019
              year_to: 2023
      responses:
        '200':
          description: Financial periods
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                periods:
                  - year: 2023
                    revenue_total: 120000000
                    profit_net: 8000000
                    cash_and_equivalents: 15000000

  /tools/get_company_people:
    post:
      tags: [Tools]
      summary: get_company_people
      operationId: get_company_people
      description: |
        People associated with a company: board members, shareholders, proxies, and other roles.
        Returns display names, role labels, and relationship types.

        **Example prompts:** “Who sits on the management board?” · “List shareholders for this NIP.”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CompanyIdentityArgs'
                - type: object
                  properties:
                    relationship_type:
                      type: string
                      description: Filter, e.g. `management` or `ownership`. Omit for all.
                      example: management
            example:
              nip: "5250000000"
              relationship_type: management
      responses:
        '200':
          description: People list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                people:
                  - display_name: Jan Kowalski
                    role: Prezes zarządu
                    relationship_type: management

  /tools/get_company_rankings:
    post:
      tags: [Tools]
      summary: get_company_rankings
      operationId: get_company_rankings
      description: |
        Revenue rank positions within industry (PKD), region (voivodeship), and all of Poland.
        Returns one row per scope: `pkd_full`, `pkd_division`, `pkd_section`, `region`, `country`.

        **Example prompts:** “Where does this company rank by revenue in Poland and in its industry?”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CompanyIdentityArgs'
                - type: object
                  properties:
                    scope_type:
                      type: string
                      enum: [pkd_full, pkd_division, pkd_section, region, country]
                      description: Optional. Filter to a single scope. Omit for all.
            example:
              name: Allegro
              scope_type: country
      responses:
        '200':
          description: Ranking rows
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                rankings:
                  - scope_type: country
                    rank: 12
                    n_companies: 500000

  /tools/get_financial_stats:
    post:
      tags: [Tools]
      summary: get_financial_stats
      operationId: get_financial_stats
      description: |
        Precomputed aggregate statistics for a sector, region, PKD branch, or country:
        median, p25/p75/p90, winsorized mean, mean, total, n_companies, min/max.
        Median and `winsor_mean` are the usual summary stats; raw mean is skewed by outliers. `cost_wages` is PLN-only.

        **Example prompts:** “What is the median revenue in PKD section J?”
        · “Compare average net profit in mazowieckie vs Poland overall.”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dimension_type:
                  type: string
                  enum: [country, pkd_section, pkd_division, pkd_class, pkd_full, region, county, city]
                  description: Granularity of the aggregate.
                  example: pkd_section
                dimension_key:
                  type: string
                  description: Key for the dimension, e.g. `PL`, `J`, `62`, `mazowieckie`. Prefix match applied.
                  example: J
                metric:
                  type: string
                  enum: [revenue_total, profit_net, total_assets, cost_wages]
                  description: Financial metric. Omit to return all metrics.
                  example: revenue_total
                currency:
                  type: string
                  enum: [PLN, EUR, USD]
                  description: Currency (default PLN). `cost_wages` is PLN-only.
                  example: PLN
            example:
              dimension_type: pkd_section
              dimension_key: J
              metric: revenue_total
              currency: PLN
      responses:
        '200':
          description: Aggregate stats
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                median: 1200000
                p25: 400000
                p75: 3500000
                n_companies: 42000

  /tools/get_company_public_aid:
