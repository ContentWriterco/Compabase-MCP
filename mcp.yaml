                  last_used_at: null

  /tools/set_byok_key:
    post:
      tags: [Account]
      summary: set_byok_key
      operationId: set_byok_key
      description: |
        Add or update a BYOK provider API key. Encrypted at rest (AES-256-GCM).
        Requires a paid plan (Pro or higher).

        **Does not consume quota.**

        Providers & key formats:
        - `openai`: `sk-…` (OpenAI API key)
        - `claude`: `sk-ant-…` (Anthropic Claude key)
        - `gemini`: `AIza…` or `AQ.…` (Google AI Studio key)

        **Example prompts:** "Set my OpenAI key to sk-proj-abc123..."

        **Parameters:** `provider` (required), `api_key` (required).
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "set_byok_key",
                "arguments": {
                  "provider": "openai",
                  "api_key": "sk-proj-your-key-here"
                }
              }
            }
      responses:
        '200':
          description: Key saved confirmation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                provider: openai
                configured: true
                key_prefix: "sk-proj-your-k…"
                updated_at: "2026-08-25T10:00:00.000Z"

  /tools/delete_byok_key:
    post:
      tags: [Account]
      summary: delete_byok_key
      operationId: delete_byok_key
      description: |
        Remove a BYOK provider key. After removal, the platform uses its own model access.

        **Does not consume quota.**

        **Example prompts:** "Remove my OpenAI key." · "Delete Gemini API key."

        **Parameters:** `provider` (required: `openai`, `claude`, or `gemini`).
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
