openapi: 3.1.0
info:
  title: Compabase MCP
  version: 1.6.2
  description: |
    ### Introduction
    Compabase MCP exposes Polish company registry data, financial statements, rankings,
    and people to AI agents through the [Model Context Protocol](https://modelcontextprotocol.io/).
    Clients such as Cursor, Claude Desktop, Windsurf, VS Code, and custom agents call structured
    tools over Streamable HTTP (JSON-RPC 2.0).

    ### Endpoint
    `https://compabase.com/api/mcp`

    Protocol: **MCP Streamable HTTP** (JSON-RPC 2.0). Server name `compabase`, protocol version
    `2024-11-05`. Supported methods: `initialize`, `tools/list`, `tools/call`, `ping`,
    `notifications/initialized`.

    ### Authentication
    You can connect **without a key** to create an account from the agent:

    - Call `request_signup` with the user's email (sends a magic link).
    - After they click the email, poll `check_signup` until `status: ready`.
    - Save the returned `mcp_key` (`mcpk_…`) in the client MCP config. After the email
      is confirmed, the key is issued for you.

    After that, send the key on every request:

    - Preferred: `Authorization: Bearer mcpk_…`
    - Alternative: `X-API-Key: mcpk_…`

    Keys can also be created in
    <a href="/integrations?tab=mcp" target="_blank" rel="noopener noreferrer">Integrations → MCP</a>.
    MCP keys (`mcpk_…`) are separate from REST API keys. Keys are stored as SHA-256 hashes and
    can be revoked immediately from the portal.

    ### Quota accounting
    **Data tools** (company search, financials, enrichments, SQL): each successful `tools/call`
    consumes one unit of the `mcp_queries` meter for your plan.
    **Account tools** (usage, plan, watchlist, keys, webhooks, BYOK, notifications) skip
    `mcp_queries`. `export_companies` is listed under Account but consumes the
    `export_companies` meter, not `mcp_queries`.
    `initialize`, `tools/list`, and `ping` also skip the meter. Limits reset with your billing
    period; see the <a href="/pricing" target="_blank" rel="noopener noreferrer">pricing page</a>.
    When the limit is reached, data tool calls return a JSON-RPC error with used/limit counts.

    ### Example prompts
    - Find active IT companies in Warsaw with revenue over 5 million PLN.
    - What is the latest revenue and net profit of Allegro?
    - List board members of the company with KRS 0000028860.
    - How many active companies in mazowieckie have primary PKD starting with 62?
    - What is the median revenue in PKD section J?
    - Is Orlen listed on GPW? What is the ticker and P/E?

servers:
  - url: https://compabase.com/api/mcp
    description: MCP Streamable HTTP endpoint

tags:
  - name: Quickstart
    description: |
      Connect your AI client to the Compabase MCP endpoint. You can start **without a key** –
      ask the agent to sign you up (`request_signup`); after email confirmation it writes
      `mcpk_…` into the client config. You can also create a key in
      <a href="/integrations?tab=mcp" target="_blank" rel="noopener noreferrer">Integrations → MCP</a>.
      Restart the client if it does not hot-reload MCP config. After connecting, ask in natural
      language; the model maps prompts to tool calls.

      The Cursor / Claude / agents recipes below show how to configure the client.
      Live traffic always goes to `POST https://compabase.com/api/mcp`.
  - name: Onboarding
    description: |
      Public tools; no MCP key required. An agent can create an account
      and receive an MCP key after the user confirms email. `upgrade_plan` still
      requires a key and returns a real Stripe Checkout URL.
  - name: Tools
    description: |
      Structured tools exposed via JSON-RPC `tools/call`. Paths below are documentation labels;
      every call goes to `POST https://compabase.com/api/mcp` with
      `method: tools/call` and `params.name` set to the tool name.

      Identify a company with `name`, `krs`, or `nip` when a tool accepts them. Monetary filters
      default to PLN unless noted. City values from KRS are typically uppercase; voivodeships lowercase.

      Register enrichments: `get_company_sudop` (public aid / de minimis), `get_company_bzp` (procurement),
      `get_company_ted` (EU TED tenders), `get_company_ure` (energy concessions), `get_company_bdo` (BDO waste/packaging),
      `get_company_gpw` (Warsaw Stock Exchange listings and delayed quotes),
      `get_company_msig` (Court and Commercial Gazette), `get_company_krz` (insolvency),
      `get_company_beneficiaries` (CRBR for KRS companies; all names, never PESEL).
  - name: Account
    description: |
      Account management: usage, plan, watchlist, API/MCP keys, webhooks, BYOK, notifications.
      These skip the `mcp_queries` meter. `export_companies` consumes the export quota instead.
      All calls go through the same `POST https://compabase.com/api/mcp` endpoint with
      `method: tools/call`.

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  /setup/cursor:
    get:
      tags: [Quickstart]
      summary: Cursor / Windsurf / VS Code
      operationId: connect_cursor
      description: |
        Add a remote MCP server entry to your project or user MCP config
        (Cursor: `.cursor/mcp.json`; VS Code / Copilot and Windsurf use the same JSON shape).
        You can connect **without a key**. Ask the agent to sign you up (`request_signup`);
        after you click the email it writes `mcpk_…` into this config. Restart the client
        if it does not hot-reload MCP config.
        The sample on the right is a local config file. Compabase does not serve this path over HTTP.
      security: []
      x-codeSamples:
        - lang: json
          label: mcp.json
          source: |
            {
              "mcpServers": {
                "compabase": {
                  "url": "https://compabase.com/api/mcp"
                }
              }
            }
      responses:
        '200':
          description: Example client config (local file)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpClientConfig'
              example:
                mcpServers:
                  compabase:
                    url: https://compabase.com/api/mcp

  /setup/claude:
    get:
      tags: [Quickstart]
      summary: Claude Desktop
      operationId: connect_claude
      description: |
        Edit `claude_desktop_config.json` and restart Claude Desktop.
        macOS: `~/Library/Application Support/Claude/` ·
        Windows: `%APPDATA%\Claude\`.
        The sample on the right is a local config file. Compabase does not serve this path over HTTP.
      security: []
      x-codeSamples:
        - lang: json
          label: claude_desktop_config.json
          source: |
            {
              "mcpServers": {
                "compabase": {
                  "url": "https://compabase.com/api/mcp",
                  "headers": {
                    "Authorization": "Bearer mcpk_YOUR_KEY_HERE"
                  }
                }
              }
            }
      responses:
        '200':
          description: Example client config (local file)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpClientConfig'
              example:
                mcpServers:
                  compabase:
                    url: https://compabase.com/api/mcp
                    headers:
                      Authorization: Bearer mcpk_YOUR_KEY_HERE

  /setup/agents:
    get:
      tags: [Quickstart]
      summary: Custom agents
      operationId: connect_agents
      description: |
        Any MCP client with Streamable HTTP can connect. Typical flow:
        `initialize` → `notifications/initialized` → `tools/list` → `tools/call`.
        Frameworks such as LangChain / LangGraph MCP adapters and LlamaIndex use the same URL
        and auth headers. Each successful **data** `tools/call` consumes one MCP query from your
        plan; account tools skip that meter. Live traffic always hits
        `POST https://compabase.com/api/mcp` (samples on the right).
      security: []
      x-codeSamples:
        - lang: bash
          label: curl tools/list
          source: |
            curl -s https://compabase.com/api/mcp \
              -H "Authorization: Bearer mcpk_YOUR_KEY_HERE" \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 2,
              "method": "tools/call",
              "params": {
                "name": "search_companies",
                "arguments": {
                  "pkd": "62",
                  "city": "WARSZAWA",
                  "revenue_min": 5000000,
                  "limit": 10
                }
              }
            }
      responses:
        '200':
          description: Example JSON-RPC result from POST /api/mcp
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  tools:
                    - name: search_companies

  # ---------------------------------------------------------------------------
  # Public onboarding tools (no MCP key)
  # ---------------------------------------------------------------------------

  /tools/request_signup:
    post:
      tags: [Onboarding]
      summary: request_signup
      operationId: request_signup
      security: []
      description: |
        Start account setup. Sends a magic-link email. Poll `check_signup` with `setup_id`
        until the user clicks the link. The assistant then receives an MCP key;
        there is nothing to copy from the portal.

        **No MCP key required. Does not consume quota.**
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "request_signup",
                "arguments": { "email": "you@company.com", "client": "cursor", "locale": "en" }
              }
            }
      responses:
        '200':
          description: Pending setup session
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                setup_id: "a1b2c3..."
                status: pending
                poll_after_seconds: 3
                expires_in_minutes: 1440

  /tools/check_signup:
    post:
      tags: [Onboarding]
      summary: check_signup
      operationId: check_signup
      security: []
      description: |
        Poll `request_signup`. When the user has confirmed email, returns `mcp_key` **once**
        and `cursor_mcp_json` to write to the client config. Then reload the MCP server.

        **No MCP key required. Does not consume quota.**
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "check_signup",
                "arguments": { "setup_id": "a1b2c3..." }
              }
            }
      responses:
        '200':
          description: pending, ready, expired, or already_delivered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: ready
                mcp_key: "mcpk_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
                cursor_mcp_json:
                  mcpServers:
                    compabase:
                      url: https://compabase.com/api/mcp
                      headers:
                        Authorization: Bearer mcpk_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4

  /tools/list_plans:
    post:
      tags: [Onboarding]
      summary: list_plans
      operationId: list_plans
      security: []
      description: |
        List Compabase billing plans and limits. After sign-up, call `upgrade_plan` with
        `plan_id` to get a Stripe Checkout URL.

        **No MCP key required. Does not consume quota.**
      x-codeSamples:
        - lang: json
          label: JSON-RPC tools/call
          source: |
            {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": { "name": "list_plans", "arguments": {} }
            }
      responses:
        '200':
          description: Plan catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                plans:
                  - id: free
                    display_name: Free
                    price_pln_monthly: 0
                    export_limit_monthly: 50
                    api_limit_monthly: 100
                    ask_ai_credits_monthly: 3
                    watchlist_limit: 10
                    mcp_queries_monthly: 10
                    allow_byok: false
                    is_contact_sales: false
                  - id: pro
                    display_name: Pro
                    price_pln_monthly: 99
                    export_limit_monthly: 1000
                    api_limit_monthly: 5000
                    ask_ai_credits_monthly: 20
                    watchlist_limit: 50
                    mcp_queries_monthly: 50
                    allow_byok: true
                    is_contact_sales: false
                  - id: scale
                    display_name: Scale
                    price_pln_monthly: 999
                    export_limit_monthly: 20000
                    api_limit_monthly: 100000
                    ask_ai_credits_monthly: 300
                    watchlist_limit: 1000
                    mcp_queries_monthly: 1000
                    allow_byok: true
                    is_contact_sales: false
                  - id: enterprise
                    display_name: Enterprise
                    price_pln_monthly: null
                    export_limit_monthly: null
                    api_limit_monthly: null
                    ask_ai_credits_monthly: null
                    watchlist_limit: null
                    mcp_queries_monthly: null
                    allow_byok: true
                    is_contact_sales: true
                message: "Free includes MCP with a small monthly query limit after sign-up. After the user confirms email, call upgrade_plan with plan_id 'pro' or 'scale' to get a Stripe checkout URL."

  /tools/search_companies:
    post:
      tags: [Tools]
      summary: search_companies
      operationId: search_companies
      description: |
        Search and filter Polish KRS companies (spółki). Compabase also holds the full CEIDG/JDG register;
        this tool does not browse JDG – those without a public contact email are hidden because of RODO.
        Default `fields=summary` returns compact rows
        (name, NIP, KRS, location, PKD, latest financials, email/phone/website).
        `fields=contacts_only` is a CRM list. `fields=full` returns every company_search column
        and may exceed MCP client size limits.

        Use for rankings, sector filters, city/county/region browsing, name search, or NIP/KRS lookup.
        For lookup by name/KRS/NIP, omit `year`. Use `year` only for sector/ranking browse.
        Sparse results in JDG-dominated PKDs include a `hint` (full CEIDG is in the database; listing is RODO-gated).
        Do not call `export_companies` just to get a handful of emails or phones.

        **Example prompts:** “Find IT companies (PKD 62) in Warsaw with revenue over 5 million PLN.”
        · “Top 20 companies by EBITDA in wielkopolskie that are still active.”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCompaniesArgs'
            example:
              pkd: "62"
              city: "WARSZAWA"
              revenue_min: 5000000
              is_active: true
              sort_by: revenue_total
              fields: summary
              limit: 20
      responses:
        '200':
          description: Tool result (JSON text content from MCP)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                fields: summary
                returned_count: 1
                companies:
                  - name: Example Sp. z o.o.
                    nip: "5250000000"
                    krs: "0000123456"
                    city: Warszawa
                    county: M.st. Warszawa
                    region: mazowieckie
                    primary_pkd: 62.01.Z
                    revenue_total: 12500000
                    profit_net: 890000
                    email: biuro@example.pl
                    phone: "221234567"
                    website: example.pl

  /tools/count_companies:
    post:
      tags: [Tools]
      summary: count_companies
      operationId: count_companies
      description: |
        Count KRS companies matching the same filter family as `search_companies` (without sort/limit).
        Does not count JDG in this tool (full CEIDG is in Compabase; listing is RODO-gated). Returns a single number; there is no company list.
        Sparse or zero counts in JDG-dominated PKDs include a `hint`.

        **Example prompts:** “How many active companies in mazowieckie have primary PKD starting with 62?”
        · “Count companies with revenue between 1 and 10 million PLN in Kraków.”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountCompaniesArgs'
            example:
              region: mazowieckie
              pkd: "62"
              is_active: true
      responses:
        '200':
          description: Count result
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
              example:
                count: 1842

  /tools/get_company:
    post:
      tags: [Tools]
      summary: get_company
      operationId: get_company
      description: |
        Registry profile and headline financials for **one** latest filed period
        (`financials.period_to`). Revenue, profit, costs, and assets in this response are that
        same period – there is no nested summary from a different year. Contacts (email, phone,
        website) are included when on record. NIP lookup also returns a CEIDG/JDG firm when it
        has a public contact email (RODO). Full balance-sheet line items and earlier years
        are in `get_financials`.

        **Example prompts:** “Give me a company profile for Allegro.” · “Look up KRS 0000028860.”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyIdentityArgs'
            example:
              name: Allegro
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                name: Allegro sp. z o.o.
                krs: "0000000000"
                nip: "5250000000"
                financial_period_to: "2025-12-31"
                revenue_total: 1000000000
                profit_net: 50000000
                financials:
                  period_to: "2025-12-31"
                  revenue_total: 1000000000
                  profit_net: 50000000
                has_email: true
                contacts:
                  email: kontakt@allegro.pl
                  phone: "226000000"
                  website: allegro.pl

  /tools/get_financials:
    post:
      tags: [Tools]
      summary: get_financials
      operationId: get_financials
      description: |
        Full financial statement metrics per fiscal period: cash, inventories, receivables,
        liabilities, equity, cost breakdown, revenue lines, and other statement columns.

        **Example prompts:** “Show cash, liabilities, and equity from 2019 to 2023.”
        · “What was net profit and total assets year by year?”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CompanyIdentityArgs'
                - type: object
                  properties:
                    year_from:
                      type: integer
                      description: Earliest fiscal year (e.g. 2019).
                      example: 2019
                    year_to:
                      type: integer
                      description: Latest fiscal year (e.g. 2023).
                      example: 2023
            example:
              krs: "0000028860"
              year_from: 2019
              year_to: 2023
      responses:
        '200':
          description: Financial periods
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                periods:
                  - year: 2023
                    revenue_total: 120000000
                    profit_net: 8000000
                    cash_and_equivalents: 15000000

  /tools/get_company_people:
    post:
      tags: [Tools]
      summary: get_company_people
      operationId: get_company_people
      description: |
        People associated with a company: board members, shareholders, proxies, and other roles.
        Returns display names, role labels, and relationship types.

        **Example prompts:** “Who sits on the management board?” · “List shareholders for this NIP.”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CompanyIdentityArgs'
                - type: object
                  properties:
                    relationship_type:
                      type: string
                      description: Filter, e.g. `management` or `ownership`. Omit for all.
                      example: management
            example:
              nip: "5250000000"
              relationship_type: management
      responses:
        '200':
          description: People list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                people:
                  - display_name: Jan Kowalski
                    role: Prezes zarządu
                    relationship_type: management

  /tools/get_company_rankings:
    post:
      tags: [Tools]
      summary: get_company_rankings
      operationId: get_company_rankings
      description: |
        Revenue rank positions within industry (PKD), region (voivodeship), and all of Poland.
        Returns one row per scope: `pkd_full`, `pkd_division`, `pkd_section`, `region`, `country`.

        **Example prompts:** “Where does this company rank by revenue in Poland and in its industry?”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CompanyIdentityArgs'
                - type: object
                  properties:
                    scope_type:
                      type: string
                      enum: [pkd_full, pkd_division, pkd_section, region, country]
                      description: Optional. Filter to a single scope. Omit for all.
            example:
              name: Allegro
              scope_type: country
      responses:
        '200':
          description: Ranking rows
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                rankings:
                  - scope_type: country
                    rank: 12
                    n_companies: 500000

  /tools/get_financial_stats:
    post:
      tags: [Tools]
      summary: get_financial_stats
      operationId: get_financial_stats
      description: |
        Precomputed aggregate statistics for a sector, region, PKD branch, or country:
        median, p25/p75/p90, winsorized mean, mean, total, n_companies, min/max.
        Median and `winsor_mean` are the usual summary stats; raw mean is skewed by outliers. `cost_wages` is PLN-only.

        **Example prompts:** “What is the median revenue in PKD section J?”
        · “Compare average net profit in mazowieckie vs Poland overall.”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dimension_type:
                  type: string
                  enum: [country, pkd_section, pkd_division, pkd_class, pkd_full, region, county, city]
                  description: Granularity of the aggregate.
                  example: pkd_section
                dimension_key:
                  type: string
                  description: Key for the dimension, e.g. `PL`, `J`, `62`, `mazowieckie`. Prefix match applied.
                  example: J
                metric:
                  type: string
                  enum: [revenue_total, profit_net, total_assets, cost_wages]
                  description: Financial metric. Omit to return all metrics.
                  example: revenue_total
                currency:
                  type: string
                  enum: [PLN, EUR, USD]
                  description: Currency (default PLN). `cost_wages` is PLN-only.
                  example: PLN
            example:
              dimension_type: pkd_section
              dimension_key: J
              metric: revenue_total
              currency: PLN
      responses:
        '200':
          description: Aggregate stats
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                median: 1200000
                p25: 400000
                p75: 3500000
                n_companies: 42000

  /tools/get_company_sudop:
    post:
      tags: [Tools]
      summary: get_company_sudop
      operationId: get_company_sudop
      description: |
        SUDOP public aid / de minimis: totals plus the full case list (amounts, grantor, purpose).
        Keyed by NIP. If several KRS entities share the same NIP, the tool still returns SUDOP for that NIP.

        **Example prompts:** “What public aid has this company received?” · “List SUDOP aid cases for NIP …”
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyIdentityArgs'
            example:
              nip: "7392954369"
      responses:
        '200':
          description: Wrapper with `registry_number`, `nip`, and `sudop` snapshot + cases
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                registry_number: "0000097877"
                nip: "7392954369"
                sudop:
                  checked_at: "2026-08-05T18:33:30.496Z"
                  has_aid: true
                  cases_count: 3045
                  total_nominal_pln: 601861882.22
                  total_gross_pln: 596691851.24
                  beneficiary_name: Zakład Gospodarki Odpadami Komunalnymi Spółka z o.o.
                  source_url: https://sudop.uokik.gov.pl
                  cases:
                    - granted_at: "2026-07-15"
                      grantor_name: BURMISTRZ MIASTA SZCZYTNO
                      purpose_name: pomoc stanowiąca rekompensatę za realizację usług świadczonych w ogólnym interesie gospodarczym
                      form_name: refundacja
                      gross_pln: 274867.77
                      nominal_pln: 274867.77

  /tools/get_company_fe:
    post:
      tags: [Tools]
      summary: get_company_fe
      operationId: get_company_fe
      description: |
        European Funds (Fundusze Europejskie) projects for one company – official MFiPR lists,
        EU co-financing, programme and dates. Keyed by NIP after unique name match.
        This is cohesion/shared-management funds, not TED procurement, not FTS Commission grants,
        and not SUDOP state aid.

