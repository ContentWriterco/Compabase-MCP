components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: mcpk
      description: "MCP key from Integrations → MCP (`Authorization: Bearer mcpk_…`)."
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Alternative header with the raw `mcpk_…` key.
  schemas:
    McpClientConfig:
      type: object
      required: [mcpServers]
      properties:
        mcpServers:
          type: object
          additionalProperties:
            type: object
            properties:
              url:
                type: string
                format: uri
              headers:
                type: object
                additionalProperties:
                  type: string
    CompanyIdentityArgs:
      type: object
      description: Identify a company with at least one of name, krs, or nip.
      properties:
        name:
          type: string
          description: Company name when KRS/NIP is unknown (legal-form suffix optional).
        krs:
          type: string
          description: KRS registry number (10 digits, zero-padded).
          example: "0000028860"
        nip:
          type: string
          description: NIP tax number (10 digits, dashes optional).
          example: "5250000000"
    SearchCompaniesArgs:
      type: object
      properties:
        name:
          type: string
          description: Company name fragment (case-insensitive). Legal-form suffixes ignored.
        krs:
          type: string
          description: KRS (10 digits, zero-padded).
        nip:
          type: string
          description: NIP (10 digits, no dashes).
        city:
          type: string
          description: City; KRS uses uppercase (e.g. WARSZAWA).
        county:
          type: string
          description: County / powiat (lowercase).
        region:
          type: string
          description: Voivodeship (lowercase), e.g. mazowieckie.
        postal_code:
          type: string
          description: Postal code prefix, e.g. 00-9.
        pkd:
          type: string
          description: Primary PKD prefix, e.g. 62 or 46.90.Z.
        all_pkd:
          type: string
          description: Match any PKD in the activity list (not only primary).
        legal_form:
          type: string
          description: Legal form fragment, e.g. spółka z o.o.
        currency:
          type: string
          enum: [pln, usd, eur]
          description: Currency for monetary filters. Default pln.
        revenue_min:
          type: number
        revenue_max:
          type: number
        profit_min:
          type: number
        profit_max:
          type: number
        profit_operating_min:
          type: number
        profit_operating_max:
          type: number
        total_assets_min:
          type: number
        total_assets_max:
          type: number
        ebitda_min:
          type: number
        ebitda_max:
          type: number
        capital_min:
          type: number
        capital_max:
          type: number
        estimated_value_min:
          type: number
        estimated_value_max:
          type: number
        is_active:
          type: boolean
          description: true = active only, false = closed only. Omit for all.
        has_email:
          type: boolean
          description: true = only companies with email on record. Matching rows include contacts.email.
        has_website:
          type: boolean
          description: true = only companies with website on record. Matching rows include contacts.website.
        sort_by:
          type: string
          enum: [revenue_total, profit_net, total_assets, profit_operating, ebitda, capital_total, estimated_value]
          description: Sort field (default revenue_total).
        sort_dir:
          type: string
          enum: [asc, desc]
          description: Sort direction (default desc).
        year:
          type: integer
          description: Latest financial period calendar year. For sector browse only; omit for identity lookup.
        limit:
          type: integer
          minimum: 1
          maximum: 50
          description: Max results (default 10, max 50).
        fields:
          type: string
          enum: [contacts_only, summary, full]
          description: >
            Response size. Default summary (name, NIP, KRS, location, PKD, latest financials,
            email/phone/website). contacts_only is a CRM list. full returns every company_search
            column and may exceed MCP client limits.
    CountCompaniesArgs:
      type: object
      properties:
        name:
          type: string
        krs:
          type: string
        nip:
          type: string
        city:
          type: string
        county:
          type: string
          description: County / powiat (lowercase).
        region:
          type: string
        pkd:
          type: string
        all_pkd:
          type: string
        legal_form:
          type: string
        revenue_min:
          type: number
        revenue_max:
          type: number
        profit_min:
          type: number
        profit_max:
          type: number
        profit_operating_min:
          type: number
        profit_operating_max:
          type: number
        total_assets_min:
          type: number
        total_assets_max:
          type: number
        ebitda_min:
          type: number
        ebitda_max:
          type: number
        capital_min:
          type: number
        capital_max:
          type: number
        estimated_value_min:
          type: number
        estimated_value_max:
          type: number
        is_active:
          type: boolean
        has_email:
          type: boolean
        has_website:
          type: boolean
        year:
          type: integer
    ExportCompaniesArgs:
      type: object
      properties:
        name:
          type: string
        krs:
          type: string
        nip:
          type: string
        city:
          type: string
        county:
          type: string
          description: County / powiat. Same filter as search_companies.
        region:
          type: string
        pkd:
          type: string
          description: Primary PKD code prefix, e.g. '80.10', '80.10.Z', or '80' (same prefix matching as search_companies).
        all_pkd:
          type: string
          description: Match any PKD code in the company's activity list (not just primary).
        revenue_min:
          type: number
        revenue_max:
          type: number
        is_active:
          type: boolean
        format:
          type: string
          enum: [csv, xlsx, json]
          description: Export format (default csv).
        locale:
          type: string
          enum: [en, pl, de]
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: Max rows (default 50, max 500).
        fields:
          type: string
          enum: [contacts_only, summary, full]
          description: >
            Payload size. Default contacts_only (name, NIP, KRS, city, email, phone, website).
            summary adds location, PKD, latest revenue/profit. full is the complete dump and
            often exceeds MCP client limits.
